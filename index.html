<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>MS Bag Shop ERP v8.4</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#0a1628;--primary-light:#1a3050;--secondary:#d4a843;--bg:#f0f4f8;--card:#ffffff;--text:#1a1a2e;--text-light:#6b7280;--border:#e5e7eb;--shadow:0 4px 24px rgba(0,0,0,0.06);--shadow-lg:0 8px 48px rgba(0,0,0,0.12);--radius:16px;--radius-sm:10px;--transition:all 0.3s ease;--gold:#d4a843;--danger:#dc2626;--success:#10b981;--warning:#f59e0b;--info:#3b82f6;--ai:#8b5cf6;--sidebar-width:260px;--header-height:60px;--red:#dc2626}
.dark-mode{--bg:#0f0f1a;--card:#1a1a2e;--text:#e2e8f0;--text-light:#94a3b8;--border:#2d3748;--shadow:0 4px 24px rgba(0,0,0,0.3);--shadow-lg:0 8px 48px rgba(0,0,0,0.4)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);transition:var(--transition);overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

/* LOGIN */
.login-container{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0a1628,#1a3050);padding:20px;position:relative;overflow:hidden}
.login-container::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(212,168,67,0.05) 0%,transparent 70%);animation:rotateBg 60s linear infinite}
@keyframes rotateBg{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.login-card{background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);padding:2.5rem 2rem;border-radius:var(--radius);width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4);position:relative;z-index:1}
.dark-mode .login-card{background:rgba(26,26,46,0.97)}
.login-card .logo{text-align:center;font-size:4rem}
.login-card h2{text-align:center;color:var(--primary);font-size:1.8rem;font-weight:700}
.dark-mode .login-card h2{color:white}
.login-card h2 span{color:var(--gold)}
.login-card .sub{text-align:center;font-size:13px;color:var(--text-light);margin-bottom:20px}
.login-card .form-group{margin-bottom:12px}
.login-card .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:4px}
.login-card .form-group input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);transition:var(--transition)}
.login-card .form-group input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(212,168,67,0.1)}
.login-card .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:var(--transition);margin-top:8px}
.login-card .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(10,22,40,0.3)}
.login-error{color:#dc2626;text-align:center;margin-top:10px;display:none;font-size:13px}

/* APP */
.app-container{display:none;min-height:100vh}

/* HEADER */
.app-header{background:var(--primary);padding:0 20px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;height:var(--header-height);z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.2)}
.app-header .left{display:flex;align-items:center;gap:14px}
.app-header .left .menu-btn{background:none;border:none;color:white;font-size:24px;cursor:pointer;padding:4px 8px;border-radius:8px}
.app-header .left .menu-btn:hover{background:rgba(255,255,255,0.1)}
.app-header .left .brand{color:white;font-size:16px;font-weight:700;letter-spacing:-0.5px}
.app-header .left .brand span{color:var(--gold)}
.app-header .left .brand small{font-size:10px;font-weight:400;opacity:0.7;margin-left:4px}
.app-header .center{flex:1;max-width:400px;margin:0 16px;position:relative;display:none}
.app-header .center input{width:100%;padding:8px 16px 8px 36px;border:none;border-radius:20px;background:rgba(255,255,255,0.12);color:white;font-size:14px;transition:var(--transition)}
.app-header .center input::placeholder{color:rgba(255,255,255,0.6)}
.app-header .center input:focus{background:rgba(255,255,255,0.2);outline:none}
.app-header .center .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.5);font-size:14px}
.app-header .right{display:flex;align-items:center;gap:10px}
.app-header .right .btn-icon{background:none;border:none;color:rgba(255,255,255,0.8);font-size:18px;cursor:pointer;padding:6px;border-radius:8px;position:relative;transition:var(--transition)}
.app-header .right .btn-icon:hover{color:white;background:rgba(255,255,255,0.1)}
.app-header .right .btn-icon .badge{position:absolute;top:0;right:0;background:var(--danger);color:white;font-size:9px;padding:2px 6px;border-radius:50%;min-width:18px;text-align:center}
.app-header .right .user-info{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:20px;background:rgba(255,255,255,0.08);cursor:pointer;transition:var(--transition)}
.app-header .right .user-info:hover{background:rgba(255,255,255,0.15)}
.app-header .right .user-info .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:white;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.app-header .right .user-info .name{color:white;font-size:13px;font-weight:500}
.app-header .right .user-info .role{color:rgba(255,255,255,0.6);font-size:10px}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-100%;width:var(--sidebar-width);height:100%;background:var(--card);z-index:200;transition:left 0.3s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;box-shadow:4px 0 30px rgba(0,0,0,0.08);padding-top:var(--header-height);border-right:1px solid var(--border)}
.sidebar.open{left:0}
.sidebar .inner{padding:8px 0 80px}
.sidebar .brand-side{padding:0 20px 16px;border-bottom:1px solid var(--border);text-align:center}
.sidebar .brand-side h2{color:var(--primary);font-size:1.1rem;font-weight:700}
.dark-mode .sidebar .brand-side h2{color:white}
.sidebar .brand-side h2 span{color:var(--gold)}
.sidebar .brand-side .ver{font-size:9px;color:var(--text-light)}
.sidebar .nav-section{font-size:9px;text-transform:uppercase;color:var(--text-light);padding:14px 20px 4px;font-weight:700;letter-spacing:1px}
.sidebar .nav-item{display:block;width:100%;padding:9px 20px;background:none;border:none;color:var(--text);text-align:left;font-size:13px;cursor:pointer;transition:var(--transition);border-left:3px solid transparent;font-weight:500}
.sidebar .nav-item:hover{background:var(--bg);color:var(--primary)}
.sidebar .nav-item.active{background:var(--bg);border-left-color:var(--gold);color:var(--primary)}
.sidebar .nav-item .icon{margin-right:10px;font-size:15px}
.sidebar .nav-divider{height:1px;background:var(--border);margin:6px 20px}
.sidebar .nav-logout{color:var(--danger) !important}
.sidebar .nav-logout:hover{background:#fee2e2 !important}
.sidebar-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:150;display:none;backdrop-filter:blur(4px)}
.sidebar-overlay.show{display:block}

/* MAIN */
.main-content{padding-top:var(--header-height);padding-left:0;padding-right:0;padding-bottom:20px;max-width:1440px;margin:0 auto;min-height:100vh}
.page-header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.page-header h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.page-header .actions{display:flex;gap:6px;flex-wrap:wrap}
.page-content{padding:0 16px 16px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:none;justify-content:space-around;padding:4px 0;box-shadow:0 -2px 20px rgba(0,0,0,0.08);z-index:100;border-top:1px solid var(--border)}
.bottom-nav button{background:none;border:none;padding:4px 6px;font-size:9px;color:var(--text-light);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:var(--transition)}
.bottom-nav button .nav-icon{font-size:18px}
.bottom-nav button.active{color:var(--primary);font-weight:600}

/* CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--card);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.kpi-card .kpi-label{font-size:10px;color:var(--text-light);text-transform:uppercase;font-weight:600}
.kpi-card .kpi-value{font-size:22px;font-weight:700;color:var(--primary);margin-top:2px}
.dark-mode .kpi-card .kpi-value{color:white}
.kpi-card .kpi-value.gold{color:var(--gold)}
.kpi-card .kpi-value.danger{color:var(--danger)}
.kpi-card .kpi-value.success{color:var(--success)}
.section-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.section-card .card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--primary)}
.dark-mode .section-card .card-title{color:white}
.section-card .card-title .badge{background:var(--secondary);color:white;font-size:10px;padding:2px 10px;border-radius:20px;font-weight:600}
.btn{padding:8px 20px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{transform:translateY(-1px)}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{transform:translateY(-1px)}
.btn-warning{background:var(--warning);color:white}
.btn-warning:hover{transform:translateY(-1px)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#d1d5db;transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:white}
.btn-gold:hover{transform:translateY(-1px)}
.btn-sm{padding:4px 12px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:500px}
table th,table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
table th{background:var(--bg);font-weight:700;color:var(--text-light);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;position:sticky;top:0;z-index:5}
table tr:hover td{background:var(--bg)}
table .empty-row td{text-align:center;color:var(--text-light);padding:24px}
.badge-status{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600}
.badge-paid{background:var(--success);color:white}
.badge-pending{background:var(--warning);color:white}
.badge-partial{background:var(--ai);color:white}
.badge-active{background:var(--success);color:white}
.badge-inactive{background:var(--danger);color:white}
.badge-low{background:var(--warning);color:white}
.badge-out{background:var(--danger);color:white}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--text-light);text-transform:uppercase;letter-spacing:0.3px}
.form-group label .req{color:var(--danger)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);transition:var(--transition)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(212,168,67,0.1)}
.form-group input[readonly]{background:var(--border);cursor:not-allowed}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:300;padding:20px;overflow-y:auto;backdrop-filter:blur(8px)}
.modal-overlay.active{display:flex;align-items:center;justify-content:center}
.modal-content{background:var(--card);border-radius:var(--radius);max-width:1000px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp 0.3s ease;border:1px solid var(--border);box-shadow:0 24px 80px rgba(0,0,0,0.2)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.modal-header h3{color:var(--primary);font-size:1.1rem;font-weight:700}
.dark-mode .modal-header h3{color:white}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);transition:var(--transition);padding:4px 8px;border-radius:8px}
.modal-close:hover{background:var(--bg);transform:rotate(90deg)}
.modal-body{max-height:calc(90vh - 120px);overflow-y:auto}
.toast-message{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:12px 24px;border-radius:12px;z-index:999;font-weight:600;box-shadow:0 8px 40px rgba(0,0,0,0.2);animation:slideUp 0.3s ease;max-width:90%;text-align:center}
.toast-message.success{background:var(--success)}
.toast-message.error{background:var(--danger)}
.toast-message.warning{background:var(--warning)}
.auto-save-indicator{position:fixed;bottom:70px;right:16px;background:var(--primary);color:white;padding:4px 14px;border-radius:20px;font-size:10px;z-index:1000;box-shadow:var(--shadow);opacity:0.9;transition:all 0.3s ease}
.auto-save-indicator.saved{background:var(--success);transform:scale(1.05)}
.auto-save-indicator.error{background:var(--danger)}
.alert-item{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid}
.alert-item.warning{background:#fef3c7;border-color:var(--warning)}
.alert-item.danger{background:#fee2e2;border-color:var(--danger)}
.alert-item.success{background:#d1fae5;border-color:var(--success)}
.alert-item.info{background:#dbeafe;border-color:var(--info)}
.dark-mode .alert-item.warning{background:#1a1a00;color:#fcd34d}
.dark-mode .alert-item.danger{background:#1a0000;color:#fca5a5}
.dark-mode .alert-item.success{background:#001a00;color:#6ee7b7}
.dark-mode .alert-item.info{background:#001a2a;color:#93c5fd}
.pos-product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px;max-height:260px;overflow-y:auto}
.pos-product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;text-align:center;cursor:pointer;transition:var(--transition)}
.pos-product-card:hover{transform:scale(1.03);border-color:var(--gold);box-shadow:var(--shadow)}
.pos-product-card .img-wrap{width:100%;height:60px;overflow:hidden;border-radius:4px;background:var(--bg)}
.pos-product-card .img-wrap img{width:100%;height:100%;object-fit:contain}
.pos-product-card .p-name{font-size:10px;font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-product-card .p-price{font-size:11px;font-weight:700;color:var(--gold)}
.pos-product-card .p-stock{font-size:9px;color:var(--text-light)}
.invoice-print{max-width:800px;margin:0 auto;background:white;color:#1a1a2e;padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}
.invoice-print .header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:14px}
.invoice-print .header .company h2{color:#0a1628;font-size:22px}
.invoice-print .header .company h2 span{color:#d4a843}
.invoice-print .header .company p{font-size:12px;color:#666}
.invoice-print .header .meta{text-align:right;font-size:13px}
.invoice-print .header .meta strong{color:#0a1628}
.invoice-print .customer{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8f9fa;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.invoice-print .customer .label{color:#666;font-weight:600}
.invoice-print table{width:100%;border-collapse:collapse;margin-bottom:14px}
.invoice-print table th{background:#0a1628;color:white;padding:6px 10px;font-size:10px;text-transform:uppercase;position:static}
.invoice-print table td{padding:6px 10px;border-bottom:1px solid #eee;font-size:13px}
.invoice-print .totals{text-align:right;padding:10px 14px;background:#f8f9fa;border-radius:8px;margin-top:10px}
.invoice-print .totals div{padding:3px 0;font-size:14px}
.invoice-print .totals .grand{font-size:20px;font-weight:700;color:#d4a843}
.invoice-print .footer{text-align:center;margin-top:16px;padding-top:10px;border-top:1px solid #eee;font-size:12px;color:#666}
.result-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center}
.result-item:hover{background:var(--bg)}
.staff-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.staff-detail-item{padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.staff-detail-item .label{font-weight:600;color:var(--text-light)}
.staff-detail-item .value{font-weight:500}
.chart-container{position:relative;height:260px;margin-top:10px}
@media(max-width:600px){.staff-detail-grid{grid-template-columns:1fr}.form-row-2{grid-template-columns:1fr}}
@media(min-width:768px){.sidebar{left:0 !important;width:var(--sidebar-width)}.main-content{margin-left:var(--sidebar-width)}.app-header .left .menu-btn{display:none}.app-header .center{display:block}.bottom-nav{display:none !important}.sidebar-overlay{display:none !important}}
@media(max-width:767px){.sidebar{left:-100% !important;width:85%;max-width:300px}.sidebar.open{left:0 !important}.app-header .center{display:none}.bottom-nav{display:flex !important}.main-content{padding-bottom:65px}.form-row-3{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}.page-header h1{font-size:17px}.page-content{padding:0 10px 10px}.app-header .right .user-info .role{display:none}.app-header .right .user-info .name{font-size:11px}}
@media print{.sidebar,.app-header,.bottom-nav,.no-print{display:none !important}.main-content{margin:0 !important;padding:20px !important}body{background:white}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="logo">👜</div>
        <h2>MS <span>Bag Shop</span></h2>
        <div class="sub">Enterprise ERP v8.4</div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginEmail" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        </div>
        <button class="login-btn" onclick="login()">🔐 Login</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- APP -->
<div class="app-container" id="appContainer">
    <header class="app-header">
        <div class="left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="brand">👜 MS <span>Bag Shop</span><small>v8.4</small></div>
        </div>
        <div class="center">
            <span class="icon">🔍</span>
            <input id="globalSearch" placeholder="Search..." onkeydown="if(event.key==='Enter')globalSearch()">
        </div>
        <div class="right">
            <button class="btn-icon" onclick="showNotifications()">🔔<span class="badge" id="notifBadge" style="display:none;">0</span></button>
            <button class="btn-icon" onclick="toggleDarkMode()">🌙</button>
            <div class="user-info" onclick="showUserMenu()">
                <div class="avatar" id="userAvatar">SA</div>
                <div>
                    <div class="name" id="userName">Super Admin</div>
                    <div class="role" id="userRole">Super Admin</div>
                </div>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar">

        });
    });

        return true;
    } catch(e) {
        console.warn('Save failed:', e);

    }
}

function startAutoSave() {
    if (autoSaveTimer) clearInterval(autoSaveTimer);

function updateAutoSaveIndicator(msg, type) {
    const el = document.getElementById('autoSaveIndicator');
    if (!el) return;
    el.textContent = msg;
    el.className = 'auto-save-indicator ' + (type || '');
    clearTimeout(el._t);
    el._t = setTimeout(() => {
        el.className = 'auto-save-indicator';
        el.textContent = '💾 Auto-Saved';
    }, 3000);
}

/* ---------- HELPERS ---------- */
function today() { return new Date().toISOString().slice(0,10); }
function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg, type) {
    const old = document.querySelector('.toast-message'); if (old) old.remove();
    const div = document.createElement('div');
    div.className = 'toast-message ' + (type || '');
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => {
        div.style.opacity='0'; div.style.transition='opacity 0.5s';
        setTimeout(() => div.remove(), 500);
    }, 3000);
}
function openModal(title, html) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
}
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
function exportToExcel(data, filename) {
    try {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
        XLSX.writeFile(wb, filename + '.xlsx');
        showToast('📊 Exported to Excel','success');
    } catch(e) { showToast('Export failed: ' + e.message,'error'); }
}

/* ---------- LOGIN ---------- */
function login() {
    const username = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    if (!username || !password) {
        errorEl.textContent = 'Enter username and password';
        errorEl.style.display = 'block';
        return;
    }
    if (!userAccounts || userAccounts.length === 0) setDefaultData();
    const user = userAccounts.find(u => u.username === username && u.password === password);
    if (!user) {
        errorEl.textContent = 'Invalid username or password.';
        errorEl.style.display = 'block';
        return;
    }
    if (user.status !== 'Active') {
        errorEl.textContent = 'Account is deactivated. Contact admin.';
        errorEl.style.display = 'block';
        return;
    }
    const staff = staffMembers.find(s => s.id === user.staffId);
    currentUser = {
        id: user.id,
        name: staff ? staff.name : user.fullName,
        role: user.role || 'Salesman',
        username: user.username,
        staffId: user.staffId,
        assignedShops: user.assignedShops || []
    };
    user.lastLogin = new Date().toISOString();
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    const initials = currentUser.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('userAvatar').textContent = initials || 'U';
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = currentUser.role;
    buildSidebar(currentUser.role);
    buildBottomNav(currentUser.role);
    navigateTo('dashboard');
    errorEl.style.display = 'none';
    addNotification(`User ${currentUser.name} logged in`, 'success');
    logAudit('LOGIN', `User ${currentUser.name} logged in`);
    saveData(false);
}

function logout() {
    if (currentUser) {
        addNotification(`User ${currentUser.name} logged out`, 'info');
        logAudit('LOGOUT', `User ${currentUser.name} logged out`);
    }
    currentUser = null;
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    closeSidebar();
}

/* ---------- SIDEBAR / BOTTOM NAV ---------- */
function buildSidebar(role) {
    const menu = POSITION_MENUS[role] || POSITION_MENUS['Salesman'];
    const nav = document.getElementById('sidebarNav');
    if (!nav) return;
    let html = '';
    menu.sections.forEach(section => {
        html += `<div class="nav-section">${section.name}</div>`;
        section.items.forEach(item => {
            const target = NAV_TARGETS[item.id] || item.id;
            html += `<button class="nav-item" data-nav="${target}" onclick="navigateTo('${target}')">
                <span class="icon">${item.icon}</span> ${item.label}</button>`;
        });
    });
    nav.innerHTML = html;
}
function buildBottomNav(role) {
    const menu = POSITION_MENUS[role] || POSITION_MENUS['Salesman'];
    const nav = document.getElementById('bottomNav');
    if (!nav) return;
    let items = [];
    if (menu.sections.length > 0) items = menu.sections[0].items.slice(0, 4);
    if (items.length < 5 && menu.sections.length > 1) {
        items = items.concat(menu.sections[1].items.slice(0, 5 - items.length));
    }
    let html = '';
    items.forEach(item => {
        const target = NAV_TARGETS[item.id] || item.id;
        html += `<button data-nav="${target}" onclick="navigateTo('${target}')">
            <span class="nav-icon">${item.icon}</span> ${item.label.substring(0,6)}</button>`;
    });
    nav.innerHTML = html;
}

/* ---------- NAVIGATION ---------- */
function canAccess(section) {
    if (!currentUser) return false;
    if (currentUser.role === 'Super Admin') return true;
    const menu = POSITION_MENUS[currentUser.role];
    if (!menu) return false;
    let allowed = false;
    menu.sections.forEach(sec => {
        sec.items.forEach(item => {
            if (NAV_TARGETS[item.id] === section) allowed = true;
        });
    });
    return allowed;
}

function navigateTo(section) {
    if (currentUser && currentUser.role !== 'Super Admin' && !canAccess(section)) {
        showToast('⛔ Access Denied — This function is not available for your position', 'error');
        return;
    }
    document.getElementById('pageTitle').textContent = TITLES[section] || section;
    closeSidebar();
    document.querySelectorAll('.sidebar .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.nav === section);
    });
    document.querySelectorAll('.bottom-nav button').forEach(el => {
        el.classList.toggle('active', el.dataset.nav === section);
    });
    const renderMap = {
        dashboard: renderDashboard, search: renderSearch, pos: renderPOS, invoices: renderInvoices,
        products: renderProducts, inventory: renderInventory, shops: renderShops,
        purchases: renderPurchases, suppliers: renderSuppliers, manufacturing: renderManufacturing,
        transfers: renderTransfers, customers: renderCustomers, coa: renderCOA,
        salesAccounting: renderSalesAccounting, purchaseAccounting: renderPurchaseAccounting,
        cashbank: renderCashBank, expenses: renderExpenses, payroll: renderPayroll, tax: renderTax,
        priceTags: renderPriceTags, printTags: renderPrintTags, priceReports: renderPriceReports,
        reportsDashboard: renderReportsDashboard, salesReports: renderSalesReports,
        inventoryReports: renderInventoryReports, purchaseReports: renderPurchaseReports,
        transferReports: renderTransferReports, customerReports: renderCustomerReports,
        supplierReports: renderSupplierReports, financeReports: renderFinanceReports,
        branchReports: renderBranchReports, staffReports: renderStaffReports,
        manufacturingReports: renderManufacturingReports, businessAnalytics: renderBusinessAnalytics,
        auditReports: renderAuditReports, users: renderUsers, backup: renderBackup,
        settings: renderSettings, cashClosing: renderCashClosing, staff: renderStaff
    };
    if (renderMap[section]) {
        try { renderMap[section](); }
        catch(e) { console.error(e); document.getElementById('pageContent').innerHTML =
            `<div class="section-card"><p style="color:var(--danger)">Error: ${esc(e.message)}</p></div>`; }
    } else {
        document.getElementById('pageContent').innerHTML =
            '<div class="section-card"><p style="color:var(--text-light)">Page under construction</p></div>';
    }
}

function posSearchProduct() {

    const results = document.getElementById('posProductResults');
    if (!query) { results.innerHTML = ''; return; }
    const matches = products.filter(p =>

    );

        </div>`).join('');
}
function posAddFirstMatch() {
    const query = document.getElementById('posProductSearch').value.trim().toLowerCase();
    const match = products.find(p => (p.barcode||'') === query || (p.sku||'').toLowerCase() === query || p.name.toLowerCase().includes(query));
    if (match) posAddProduct(match.id);
    else showToast('No product matched','error');
}
function posAddProduct(id) {
    const p = products.find(pr => pr.id === id);
    if (!p) { showToast('Product not found','error'); return; }
    const qty = parseInt(document.getElementById('posQty').value) || 1;
    if (qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`,'error'); return; }
    const existing = posCart.find(item => item.id === p.id);
    if (existing) {
        if (existing.qty + qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`,'error'); return; }
        existing.qty += qty;
        existing.lineTotal = existing.qty * existing.price;
    } else {
        posCart.push({
            id: p.id, name: p.name, sku: p.sku || '',
            price: p.sellingPrice, cost: p.costPrice, qty: qty,
            lineTotal: qty * p.sellingPrice, stock: p.stock
        });
    }
    document.getElementById('posProductSearch').value = '';
    document.getElementById('posProductResults').innerHTML = '';
    document.getElementById('posQty').value = 1;
    document.getElementById('posPrice').value = p.sellingPrice;
    posUpdateCart();
    showToast(`✅ ${p.name} added`,'success');
}
function posRemoveFromCart(idx) { posCart.splice(idx,1); posUpdateCart(); }
function posClearCart() {
    if (posCart.length && confirm('Clear cart?')) { posCart = []; posUpdateCart(); }
}
function posUpdateCart() {
    const container = document.getElementById('posCart');
    const count = document.getElementById('cartCount');
    if (!container) return;
    if (count) count.textContent = posCart.length;
    if (!posCart.length) {
        container.innerHTML = '<p style="color:var(--text-light);padding:10px;text-align:center;">Cart empty</p>';
        posCalcTotals(); return;
    }
    container.innerHTML = `<div class="table-wrapper"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>
        ${posCart.map((item, idx) => `<tr>
            <td><strong>${esc(item.name)}</strong></td>
            <td><button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx},-1)">−</button> ${item.qty} <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx},1)">+</button></td>
            <td>${CURRENCY} ${item.price}</td>
            <td>${CURRENCY} ${item.lineTotal.toFixed(2)}</td>
            <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${idx})">✕</button></td>
        </tr>`).join('')}
    </tbody></table></div>`;
    posCalcTotals();
}
function posChangeQty(idx, delta) {
    const item = posCart[idx];
    if (!item) return;
    const newQty = item.qty + delta;
    if (newQty < 1) return;
    const prod = products.find(p => p.id === item.id);
    if (prod && newQty > prod.stock) { showToast(`Insufficient stock! Available: ${prod.stock}`,'error'); return; }
    item.qty = newQty;
    item.lineTotal = item.qty * item.price;
    posUpdateCart();
}
function posCalcTotals() {
    const subtotal = posCart.reduce((s,i) => s + i.lineTotal, 0);
    const discount = parseFloat(document.getElementById('posDiscount')?.value) || 0;
    const taxRate = settings.taxRate || VAT_RATE;
    const afterDiscount = Math.max(0, subtotal - discount);
    const tax = afterDiscount * taxRate;
    const grandTotal = afterDiscount + tax;
    const paid = parseFloat(document.getElementById('posPaid')?.value) || 0;
    const change = Math.max(0, paid - grandTotal);
    const el = id => document.getElementById(id);
    if (el('posSubtotal')) el('posSubtotal').value = subtotal.toFixed(2);
    if (el('posTax')) el('posTax').value = tax.toFixed(2);
    if (el('posGrandTotal')) el('posGrandTotal').value = grandTotal.toFixed(2);
    if (el('posChange')) el('posChange').value = change.toFixed(2);
    if (el('posStatus')) el('posStatus').value = (paid >= grandTotal && grandTotal > 0) ? 'Paid' : (paid > 0 ? 'Partial' : 'Due');
    return { subtotal, discount, tax, grandTotal, paid, change };
}
function _posBuildInvoice() {
    if (!posCart.length) { showToast('Cart is empty','error'); return null; }
    const totals = posCalcTotals();
    const customerName = document.getElementById('posCustomer').value.trim();
    const customerPhone = document.getElementById('posCustomerPhone').value.trim();
    const shop = document.getElementById('posShop').value;
    const paymentMethod = document.getElementById('posPayment').value;
    let customer = customers.find(c => c.fullName === customerName && c.mobile === customerPhone);
    if (!customer && customerName) customer = customers.find(c => c.fullName === customerName);
    if (!customer && customerName) {
        customer = {
            id:'C' + String(counters.customer++).padStart(3,'0'),
            fullName:customerName, mobile:customerPhone, email:'', address:'',
            membershipLevel:'Regular', loyaltyPoints:0, creditLimit:0, custCredit:0,
            totalPurchases:0, dueBalance:0, customerType:'Retail', createdAt:new Date().toISOString()
        };
        customers.push(customer);
    }
    for (const item of posCart) {
        const p = products.find(pr => pr.id === item.id);
        if (!p || p.stock < item.qty) { showToast(`Insufficient stock for ${item.name}`,'error'); return null; }
    }
    const invoiceNumber = document.getElementById('posInvNumber').value;
    const invoiceDate = document.getElementById('posInvDate').value;
    const cogs = posCart.reduce((s,i) => s + (i.cost||0) * i.qty, 0);
    const invoice = {
        id: 'INV' + String(counters.invoice++).padStart(5,'0'),
        invoiceNumber, date: invoiceDate, shop,
        customerId: customer?.id || null,
        customerName: customer?.fullName || 'Walk-in Customer',
        customerPhone: customer?.mobile || '',
        items: posCart.map(i => ({ ...i })),
        subtotal: totals.subtotal, discount: totals.discount, tax: totals.tax,
        grandTotal: totals.grandTotal, paid: totals.paid, change: totals.change,
        due: Math.max(0, totals.grandTotal - totals.paid),
        paymentMethod,
        status: totals.paid >= totals.grandTotal ? 'Paid' : (totals.paid > 0 ? 'Partial' : 'Due'),
        cogs, salesman: currentUser?.name || 'System',
        createdAt: new Date().toISOString()
    };
    invoices.push(invoice);
    settings.nextInvoiceNumber = (settings.nextInvoiceNumber || 1001) + 1;

    posCart.forEach(item => {
        const p = products.find(pr => pr.id === item.id);
        if (p) {
            p.stock -= item.qty;
            p.salesCount = (p.salesCount || 0) + item.qty;
            if (shopInventory[p.id] && shopInventory[p.id][shop] !== undefined) {
                shopInventory[p.id][shop] = Math.max(0, shopInventory[p.id][shop] - item.qty);
            }
            stockMovements.push({
                id: 'SM' + String(stockMovements.length + 1).padStart(5,'0'),
                productId: p.id, productName: p.name, type:'SALE', qty: -item.qty,
                shop, reference: invoiceNumber, date: invoiceDate, user: currentUser?.name || 'System'
            });
        }
    });
    if (customer) {
        customer.totalPurchases = (customer.totalPurchases || 0) + totals.grandTotal;
        customer.loyaltyPoints = (customer.loyaltyPoints || 0) + Math.floor(totals.grandTotal / 100);
        customer.dueBalance = (customer.dueBalance || 0) + Math.max(0, totals.grandTotal - totals.paid);
    }
    if (paymentMethod === 'eSewa') esewa.balance = (esewa.balance||0) + totals.paid;

    postJournalEntry(invoiceDate, `Sale ${invoiceNumber}`, invoice.id, [
        { accountId:'A1', debit: totals.paid, credit: 0 },
        { accountId:'A5', debit: Math.max(0, totals.grandTotal - totals.paid), credit: 0 },
        { accountId:'I1', debit: 0, credit: totals.subtotal - totals.discount },
        { accountId:'L2', debit: 0, credit: totals.tax }
    ], shop);

    logAudit('SALE', `Invoice ${invoiceNumber} — ${CURRENCY} ${totals.grandTotal.toFixed(2)}`);
    addNotification(`Sale ${invoiceNumber}: ${CURRENCY} ${totals.grandTotal.toFixed(2)}`,'success');
    saveData(true);
    return invoice;
}
function posCompleteSale() {
    const invoice = _posBuildInvoice();
    if (!invoice) return;
    showToast(`✅ Sale completed: ${invoice.invoiceNumber}`, 'success');
    posCart = [];
    renderPOS();

function posPrintInvoiceById(id) {

    }, 200);
}

function posHoldSale() {
    if (!posCart.length) { showToast('Cart is empty','error'); return; }
    heldSales.push({ cart: JSON.parse(JSON.stringify(posCart)),
        customer: document.getElementById('posCustomer').value,
        shop: document.getElementById('posShop').value,
        heldAt: new Date().toISOString() });
    posCart = [];
    posUpdateCart();
    showToast('📌 Sale held','success');
}
function posResumeSale() {
    if (!heldSales.length) { showToast('No held sales','warning'); return; }
    const sale = heldSales.pop();
    posCart = sale.cart;
    document.getElementById('posCustomer').value = sale.customer || '';
    posUpdateCart();
    showToast('▶️ Sale resumed','success');
}

function saveProduct(id) {
    const name = document.getElementById('pName').value.trim();
    if (!name) { showToast('Product name required','error'); return; }
    const data = {
        name, sku: document.getElementById('pSku').value.trim(),
        barcode: document.getElementById('pBarcode').value.trim(),
        category: document.getElementById('pCategory').value,
        brand: document.getElementById('pBrand').value,
        color: document.getElementById('pColor').value.trim(),
        costPrice: parseFloat(document.getElementById('pCostPrice').value) || 0,
        sellingPrice: parseFloat(document.getElementById('pSellingPrice').value) || 0,
        mrpPrice: parseFloat(document.getElementById('pMrp').value) || 0,
        stock: parseInt(document.getElementById('pStock').value) || 0,
        minStock: parseInt(document.getElementById('pMinStock').value) || 5,
        warehouse: document.getElementById('pWarehouse').value,
        description: document.getElementById('pDesc').value.trim(),
        status: document.getElementById('pStatus').value
    };
    const img = document.getElementById('pImage').value.trim();
    if (img) data.images = [img];
    if (id) {
        const p = products.find(pr => pr.id === id);
        if (!p) return;
        if (p.sellingPrice !== data.sellingPrice) {
            priceHistory.push({ productId: p.id, oldPrice: p.sellingPrice, newPrice: data.sellingPrice, date: new Date().toISOString() });
        }
        Object.assign(p, data);
        if (!shopInventory[p.id]) shopInventory[p.id] = {};
        shopInventory[p.id][data.warehouse] = data.stock;
        logAudit('UPDATE_PRODUCT', `Product ${p.name} updated`);
    } else {
        const p = { id:'P' + String(counters.product++).padStart(3,'0'), ...data,
            salesCount:0, createdAt:new Date().toISOString() };
        if (img) p.images = [img];
        products.push(p);
        if (!shopInventory[p.id]) shopInventory[p.id] = {};
        shopInventory[p.id][data.warehouse] = data.stock;
        logAudit('CREATE_PRODUCT', `Product ${p.name} created`);
    }
    saveData(true); closeModal(); showToast('✅ Product saved','success'); renderProducts();
}
function deleteProduct(id) {
    const p = products.find(pr => pr.id === id);
    if (!p || !confirm(`Delete ${p.name}?`)) return;
    products = products.filter(pr => pr.id !== id);
    delete shopInventory[id];
    saveData(true); showToast('🗑️ Deleted','success'); renderProducts();
}

function saveAdjustment(id) {
    const p = products.find(pr => pr.id === id);
    if (!p) return;
    const qty = parseInt(document.getElementById('adjQty').value) || 0;
    const reason = document.getElementById('adjReason').value.trim() || 'Adjustment';
    if (!qty) { showToast('Cannot be 0','error'); return; }
    p.stock = Math.max(0, p.stock + qty);
    if (shopInventory[p.id] && shopInventory[p.id][p.warehouse] !== undefined) {
        shopInventory[p.id][p.warehouse] = Math.max(0, shopInventory[p.id][p.warehouse] + qty);
    }
    stockMovements.push({ id:'SM'+String(stockMovements.length+1).padStart(5,'0'),
        productId:p.id, productName:p.name, type:'ADJUSTMENT', qty,
        shop:p.warehouse, reference:reason, date:today(), user:currentUser?.name||'System' });
    saveData(true); closeModal(); showToast('✅ Adjusted','success'); renderInventory();
}

    openModal('📥 New Purchase', `

        </div>
        <div class="form-row-2">
            <div class="form-group"><label>Product</label><select id="purProduct" onchange="purPrefill()">${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>
            <div class="form-group"><label>Qty</label><input id="purQty" type="number" value="1" min="1"></div>

        </div>
        <div class="btn-group"><button class="btn btn-gold" onclick="savePurchase()">💾 Save</button>
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`);
    purPrefill();
}
function purPrefill() {
    const pid = document.getElementById('purProduct')?.value;
    const p = products.find(x => x.id === pid);
    if (p) document.getElementById('purCost').value = p.costPrice || 0;
}
function savePurchase() {
    const supplier = suppliers.find(s => s.id === document.getElementById('purSupplier').value);
    const product = products.find(p => p.id === document.getElementById('purProduct').value);
    const qty = parseInt(document.getElementById('purQty').value) || 0;
    const cost = parseFloat(document.getElementById('purCost').value) || 0;
    if (!product || qty <= 0) { showToast('Invalid data','error'); return; }
    const totalAmount = qty * cost;
    const purchase = {
        id:'PUR' + String(counters.purchase).padStart(5,'0'),
        poNumber:'PO-' + String(counters.purchase).padStart(5,'0'),
        date: document.getElementById('purDate').value,
        supplierId: supplier?.id, supplierName: supplier?.supplierName || 'Unknown',
        shop: product.warehouse, paymentMethod: document.getElementById('purPayment').value,
        productId: product.id, productName: product.name,
        qty, unitCost: cost, totalAmount,
        user: currentUser?.name || 'System', createdAt: new Date().toISOString()
    };
    counters.purchase++;
    purchases.push(purchase);
    product.stock += qty;
    if (shopInventory[product.id] && shopInventory[product.id][purchase.shop] !== undefined) {
        shopInventory[product.id][purchase.shop] += qty;
    }
    stockMovements.push({ id:'SM'+String(stockMovements.length+1).padStart(5,'0'),
        productId:product.id, productName:product.name, type:'PURCHASE', qty,
        shop:purchase.shop, reference:purchase.poNumber, date:purchase.date, user:currentUser?.name||'System' });
    if (supplier && purchase.paymentMethod === 'Credit') supplier.dueAmount = (supplier.dueAmount||0) + totalAmount;
    postJournalEntry(purchase.date, `Purchase ${purchase.poNumber}`, purchase.id, [
        { accountId:'A4', debit: totalAmount, credit: 0 },
        { accountId: purchase.paymentMethod === 'Credit' ? 'L1' : 'A1', debit: 0, credit: totalAmount }
    ], purchase.shop);
    saveData(true); closeModal(); showToast('✅ Purchase saved','success'); renderPurchases();
}

}
function getAccountBalance(accountId) {
    let balance = 0;
    const account = chartOfAccounts.find(a => a.id === accountId);
    if (!account) return 0;
    journalEntries.forEach(entry => {
        const line = entry.lines.find(l => l.accountId === accountId);
        if (line) {
            if (account.normalBalance === 'Debit') balance += (line.debit||0) - (line.credit||0);
            else balance += (line.credit||0) - (line.debit||0);
        }
    });
    return balance;
}
function postJournalEntry(date, description, reference, lines, shop) {
    journalEntries.push({
        id: 'JE' + String(journalEntries.length + 1).padStart(6,'0'),
        date: date || today(), description, reference, shop: shop || 'All', lines,
        createdAt: new Date().toISOString()
    });
    saveData(false);

/* ---------- BACKUP ---------- */
function renderBackup() {
    document.getElementById('pageContent').innerHTML = `
        <div class="section-card">
            <div class="card-title">💾 Backup & Restore</div>
            <div class="btn-group">
                <button class="btn btn-gold" onclick="downloadBackup()">📥 Download JSON</button>
                <button class="btn btn-secondary" onclick="document.getElementById('restoreFile').click()">📤 Restore</button>
                <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup(event)">
                <button class="btn btn-danger" onclick="resetAllData()">⚠️ Factory Reset</button>
            </div>
        </div>`;
}
function downloadBackup() {
    const data = localStorage.getItem(STORAGE_KEY)||'{}';
    const blob = new Blob([data], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `msbag-backup-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}
function restoreBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            JSON.parse(e.target.result);
            localStorage.setItem(STORAGE_KEY, e.target.result);
            showToast('✅ Restored. Reloading...','success');
            setTimeout(() => location.reload(), 1200);
        } catch(err) { showToast('Invalid file','error'); }
    };
    reader.readAsText(file);
}
function resetAllData() {
    if (!confirm('Factory reset — delete ALL data?')) return;
    if (!confirm('Are you absolutely sure?')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
}
