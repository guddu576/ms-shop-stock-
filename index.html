                        <button class="btn btn-warning" onclick="restoreBackup()">📂 Restore Backup</button>
                        <button class="btn btn-danger" onclick="clearData()">🗑️ Clear All Data</button>
                    </div>
                    <div class="table-wrapper" style="margin-top:10px;">
                        <table><thead><tr><th>Backup</th><th>Date</th><th>Size</th><th>Action</th></tr></thead>
                        <tbody>${backups.length===0?'<tr><td colspan="4" class="empty-row">No backups found</td></tr>':
                        backups.map((b,i)=>`
                            <tr>
                                <td><strong>Backup #${i+1}</strong></td>
                                <td>${b.date||b.createdAt||'-'}</td>
                                <td>${b.size||'N/A'}</td>
                                <td><button class="btn btn-sm btn-secondary" onclick="downloadBackup(${i})">📥 Download</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteBackup(${i})">🗑️</button></td>
                            </tr>
                        `).join('')}</tbody></table>
                    </div>
                </div>
            `;
            document.getElementById('pageContent').innerHTML = html;
        }

        function createBackup() {
            const data = {
                products, customers, suppliers, invoices, purchases, purchaseOrders,
                productionOrders, shopTransfers, expenses, transactions, stockMovements,
                staffMembers, userAccounts, priceHistory,
                notifications, settings, shopInventory, auditLogs, esewa, counters,
                shops, chartOfAccounts, journalEntries, payroll, taxRecords,
                backupDate: new Date().toISOString()
            };
            const json = JSON.stringify(data);
            const blob = new Blob([json], { type: 'application/json' });
            const size = (blob.size / 1024).toFixed(2) + ' KB';
            backups.push({ date: new Date().toISOString(), size, data: json, createdAt: new Date().toISOString() });
            showToast('💾 Backup created successfully', 'success');
            logAudit('BACKUP', 'Created backup');
            renderBackup();
            saveData(true);
        }

        function restoreBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.products) { showToast('Invalid backup file', 'error'); return; }
                        if (!confirm('Restore will overwrite all current data. Continue?')) return;
                        Object.assign(window, data);
                        showToast('📂 Backup restored successfully', 'success');
                        logAudit('RESTORE', 'Restored from backup');
                        navigateTo('dashboard');
                        saveData(true);
                    } catch (err) { showToast('Restore failed: ' + err.message, 'error'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function downloadBackup(idx) {
            const b = backups[idx];
            if (!b) return;
            const blob = new Blob([b.data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `MS_Bag_Backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function deleteBackup(idx) {
            backups.splice(idx, 1);
            showToast('🗑️ Backup deleted', 'warning');
            renderBackup();
            saveData(true);
        }

        function clearData() {
            if (!confirm('⚠️ This will delete ALL data. Are you sure?')) return;
            if (!confirm('⚠️ Final warning: This action cannot be undone!')) return;
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function renderSettings() {
            if (!canAccess('settings')) { showToast('⛔ Access Denied', 'error'); return; }
            let html = `
                <div class="section-card">
                    <div class="card-title">⚙️ Settings</div>
                    <div class="form-row-3">
                        <div class="form-group"><label>Shop Name</label><input id="setShopName" value="${settings.shopName||COMPANY}"></div>
                        <div class="form-group"><label>Address</label><input id="setAddress" value="${settings.address||ADDRESS}"></div>
                        <div class="form-group"><label>Phone</label><input id="setPhone" value="${settings.phone||PHONE}"></div>
                    </div>
                    <div class="form-row-3">
                        <div class="form-group"><label>Email</label><input id="setEmail" value="${settings.email||EMAIL}"></div>
                        <div class="form-group"><label>VAT Number</label><input id="setVat" value="${settings.vatNumber||''}"></div>
                        <div class="form-group"><label>Tax Rate (%)</label><input id="setTax" type="number" step="0.1" value="${(settings.taxRate||VAT_RATE)*100}"></div>
                    </div>
                    <div class="form-row-3">
                        <div class="form-group"><label>Invoice Prefix</label><input id="setInvPrefix" value="${settings.invoicePrefix||'INV'}"></div>
                        <div class="form-group"><label>Next Invoice #</label><input id="setNextInv" type="number" value="${settings.nextInvoiceNumber||1001}"></div>
                    </div>
                    <div class="form-group"><label>Receipt Footer</label><textarea id="setFooter" rows="2">${settings.receiptFooter||'Thank you for shopping with MS Bag Shop!'}</textarea></div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
                        <button class="btn btn-secondary" onclick="location.reload()">🔄 Refresh</button>
                    </div>
                </div>
            `;
            document.getElementById('pageContent').innerHTML = html;
        }

        function saveSettings() {
            settings.shopName = document.getElementById('setShopName').value.trim() || COMPANY;
            settings.address = document.getElementById('setAddress').value.trim() || ADDRESS;
            settings.phone = document.getElementById('setPhone').value.trim() || PHONE;
            settings.email = document.getElementById('setEmail').value.trim() || EMAIL;
            settings.vatNumber = document.getElementById('setVat').value.trim();
            settings.taxRate = parseFloat(document.getElementById('setTax').value) / 100 || VAT_RATE;
            settings.invoicePrefix = document.getElementById('setInvPrefix').value.trim() || 'INV';
            settings.nextInvoiceNumber = parseInt(document.getElementById('setNextInv').value) || 1001;
            settings.receiptFooter = document.getElementById('setFooter').value.trim();
            showToast('⚙️ Settings saved', 'success');
            logAudit('SETTINGS', 'Updated system settings');
            saveData(true);
        }

        // ============================================================
        // CASH CLOSING (For Cashier)
        // ============================================================
        function renderCashClosing() {
            if (!canAccess('cashClosing')) { showToast('⛔ Access Denied', 'error'); return; }
            const today = new Date().toISOString().slice(0, 10);
            const todaySales = invoices.filter(inv => inv.date === today && inv.paymentMethod === 'Cash');
            const totalCash = todaySales.reduce((s, inv) => s + inv.grandTotal, 0);
            const cashExpenses = expenses.filter(e => e.date === today && e.paymentMethod === 'Cash');
            const totalExpenses = cashExpenses.reduce((s, e) => s + e.amount, 0);
            const netCash = totalCash - totalExpenses;

            let html = `
                <div class="section-card">
                    <div class="card-title">💰 Cash Closing - ${today}</div>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="kpi-label">Cash Sales Today</div><div class="kpi-value gold">${CURRENCY} ${totalCash.toFixed(2)}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Cash Expenses</div><div class="kpi-value danger">${CURRENCY} ${totalExpenses.toFixed(2)}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Net Cash</div><div class="kpi-value ${netCash>=0?'success':'danger'}">${CURRENCY} ${netCash.toFixed(2)}</div></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="showToast('✅ Cash closing completed','success')">✅ Close Cash</button>
                        <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Report</button>
                    </div>
                </div>
            `;
            document.getElementById('pageContent').innerHTML = html;
        }

        // ============================================================
        // GLOBAL SEARCH
        // ============================================================
        function globalSearch() {
            const query = document.getElementById('globalSearch').value.trim().toLowerCase();
            if (!query) return;
            navigateTo('search');
            document.getElementById('searchQuery').value = query;
            performSearch();
        }

        // ============================================================
        // INIT
        // ============================================================
        window.onload = function() {
            initData();
            // Show login by default
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        };
    </script>
</body>
</html>
