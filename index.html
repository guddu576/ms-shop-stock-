<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>MS Bag Shop ERP v8.4</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a3050;
            --secondary: #d4a843;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --gold: #d4a843;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --ai: #8b5cf6;
            --sidebar-width: 260px;
            --header-height: 60px;
            --red: #dc2626;
        }
        .dark-mode {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #2d3748;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

        /* ===== LOGIN ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628, #1a3050);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(212, 168, 67, 0.05) 0%, transparent 70%);
            animation: rotateBg 60s linear infinite;
        }
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        .dark-mode .login-card { background: rgba(26, 26, 46, 0.97); }
        .login-card .logo { text-align: center; font-size: 4rem; }
        .login-card h2 { text-align: center; color: var(--primary); font-size: 1.8rem; font-weight: 700; }
        .dark-mode .login-card h2 { color: white; }
        .login-card h2 span { color: var(--gold); }
        .login-card .sub { text-align: center; font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
        .login-card .form-group { margin-bottom: 12px; }
        .login-card .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
        .login-card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .login-card .form-group input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .login-card .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .login-card .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(10, 22, 40, 0.3); }
        .login-error { color: #dc2626; text-align: center; margin-top: 10px; display: none; }

        /* ===== APP ===== */
        .app-container { display: none; min-height: 100vh; }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--primary);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        .app-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .left .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .app-header .left .menu-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .app-header .left .brand {
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .app-header .left .brand span { color: var(--gold); }
        .app-header .left .brand small { font-size: 10px; font-weight: 400; opacity: 0.7; margin-left: 4px; }
        .app-header .center {
            flex: 1;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
            display: none;
        }
        .app-header .center input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 14px;
            transition: var(--transition);
        }
        .app-header .center input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .app-header .center input:focus { background: rgba(255, 255, 255, 0.2); outline: none; }
        .app-header .center .icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .app-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header .right .btn-icon {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .right .btn-icon:hover { color: white; background: rgba(255, 255, 255, 0.1); }
        .app-header .right .btn-icon .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }
        .app-header .right .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: var(--transition);
        }
        .app-header .right .user-info:hover { background: rgba(255, 255, 255, 0.15); }
        .app-header .right .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .app-header .right .user-info .name { color: white; font-size: 13px; font-weight: 500; }
        .app-header .right .user-info .role { color: rgba(255, 255, 255, 0.6); font-size: 10px; }
        .app-header .right .shop-select {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        .app-header .right .shop-select option { color: var(--text); background: var(--card); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--card);
            z-index: 200;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.08);
            padding-top: var(--header-height);
            border-right: 1px solid var(--border);
        }
        .sidebar.open { left: 0; }
        .sidebar .inner { padding: 8px 0 80px; }
        .sidebar .brand-side {
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar .brand-side h2 { color: var(--primary); font-size: 1.1rem; font-weight: 700; }
        .sidebar .brand-side h2 span { color: var(--gold); }
        .sidebar .brand-side .ver { font-size: 9px; color: var(--text-light); }
        .sidebar .nav-section {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-light);
            padding: 14px 20px 4px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .sidebar .nav-item {
            display: block;
            width: 100%;
            padding: 9px 20px;
            background: none;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-weight: 500;
        }
        .sidebar .nav-item:hover { background: var(--bg); color: var(--primary); }
        .sidebar .nav-item.active { background: var(--bg); border-left-color: var(--gold); color: var(--primary); }
        .sidebar .nav-item .icon { margin-right: 10px; font-size: 15px; }
        .sidebar .nav-divider { height: 1px; background: var(--border); margin: 6px 20px; }
        .sidebar .nav-logout { color: var(--danger) !important; }
        .sidebar .nav-logout:hover { background: #fee2e2 !important; }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            display: none;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show { display: block; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding-top: var(--header-height);
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 20px;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .page-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
        .page-header h1 small { font-size: 13px; font-weight: 400; color: var(--text-light); margin-left: 6px; }
        .page-header .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .page-content { padding: 0 16px 16px; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: none;
            justify-content: space-around;
            padding: 4px 0;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.08);
            z-index: 100;
            border-top: 1px solid var(--border);
        }
        .bottom-nav button {
            background: none;
            border: none;
            padding: 4px 6px;
            font-size: 9px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            transition: var(--transition);
        }
        .bottom-nav button .nav-icon { font-size: 18px; }
        .bottom-nav button.active { color: var(--primary); font-weight: 600; }

        /* ===== CARDS & GRIDS ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: var(--card);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .kpi-card .kpi-label { font-size: 10px; color: var(--text-light); text-transform: uppercase; font-weight: 600; }
        .kpi-card .kpi-value { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 2px; }
        .kpi-card .kpi-value.gold { color: var(--gold); }
        .kpi-card .kpi-value.danger { color: var(--danger); }
        .kpi-card .kpi-value.success { color: var(--success); }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .section-card:hover { box-shadow: var(--shadow); }
        .section-card .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        .dark-mode .section-card .card-title { color: white; }
        .section-card .card-title .badge {
            background: var(--secondary);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { transform: translateY(-1px); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { transform: translateY(-1px); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #d1d5db; transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: white; }
        .btn-gold:hover { transform: translateY(-1px); }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
        .btn-ai:hover { transform: translateY(-1px); }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

        .table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        table th, table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
        table th {
            background: var(--bg);
            font-weight: 700;
            color: var(--text-light);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        table tr:hover td { background: var(--bg); }
        table .empty-row td { text-align: center; color: var(--text-light); padding: 24px; }

        .badge-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-paid { background: var(--success); color: white; }
        .badge-pending { background: var(--warning); color: white; }
        .badge-overdue { background: var(--danger); color: white; }
        .badge-active { background: var(--success); color: white; }
        .badge-inactive { background: var(--danger); color: white; }
        .badge-low { background: var(--warning); color: white; }
        .badge-out { background: var(--danger); color: white; }
        .badge-partial { background: var(--ai); color: white; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.3px; }
        .form-group label .req { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .form-group input[readonly] { background: var(--border); cursor: not-allowed; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .modal-header h3 { color: var(--primary); font-size: 1.1rem; font-weight: 700; }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-close:hover { background: var(--bg); transform: rotate(90deg); }
        .modal-body { max-height: calc(90vh - 120px); overflow-y: auto; }

        .toast-message {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 999;
            font-weight: 600;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast-message.success { background: var(--success); }
        .toast-message.error { background: var(--danger); }
        .toast-message.warning { background: var(--warning); }

        .auto-save-indicator {
            position: fixed;
            bottom: 70px;
            right: 16px;
            background: var(--primary);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 1000;
            box-shadow: var(--shadow);
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        .auto-save-indicator.saved { background: var(--success); transform: scale(1.05); }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .sidebar { left: 0 !important; width: var(--sidebar-width); }
            .main-content { margin-left: var(--sidebar-width); }
            .app-header .left .menu-btn { display: none; }
            .app-header .center { display: block; }
            .bottom-nav { display: none !important; }
            .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
            .sidebar-overlay { display: none !important; }
        }
        @media (max-width: 767px) {
            .sidebar { left: -100% !important; width: 85%; max-width: 300px; }
            .sidebar.open { left: 0 !important; }
            .app-header .center { display: none; }
            .bottom-nav { display: flex !important; }
            .main-content { padding-bottom: 65px; }
            .form-row-3 { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
            .page-header h1 { font-size: 17px; }
            .page-content { padding: 0 10px 10px; }
            .app-header .right .user-info .role { display: none; }
            .app-header .right .user-info .name { font-size: 11px; }
        }
        @media print {
            .sidebar, .app-header, .bottom-nav, .no-print { display: none !important; }
            .main-content { margin: 0 !important; padding: 20px !important; }
        }

        .empty-state { text-align: center; padding: 30px 16px; color: var(--text-light); }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-state .empty-title { font-size: 16px; font-weight: 600; color: var(--text); }
        .empty-state .empty-desc { font-size: 13px; }

        .alert-item {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            display: flex;

                    notifications, settings, shopInventory, auditLogs, esewa, counters,
                    shops, chartOfAccounts, journalEntries, payroll, taxRecords,
                    lastSaved: new Date().toISOString()

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

            } catch (e) {

        function exportToExcel(data, filename) {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + '.xlsx';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function postJournalEntry(date, description, reference, lines, shop = 'All') {
            const entry = {
                id: 'JE' + String(journalEntries.length + 1).padStart(6, '0'),
                date: date || new Date().toISOString().slice(0, 10),
                description: description,
                reference: reference,
                shop: shop,
                lines: lines,
                createdAt: new Date().toISOString()
            };
            journalEntries.push(entry);
            saveData(false);
            return entry;
        }

        function getAccountBalance(accountId, shop = null) {
            let balance = 0;
            const account = chartOfAccounts.find(a => a.id === accountId);
            if (!account) return 0;
            journalEntries.forEach(entry => {
                if (shop && entry.shop !== shop && entry.shop !== 'All') return;
                const line = entry.lines.find(l => l.accountId === accountId);
                if (line) {
                    if (account.normalBalance === 'Debit') {
                        balance += (line.debit || 0) - (line.credit || 0);
                    } else {
                        balance += (line.credit || 0) - (line.debit || 0);
                    }
                }
            });
            return balance;
        }

        function getBalanceSheet(shop = null) {
            let assets = 0,
                liabilities = 0,
                equity = 0;
            chartOfAccounts.forEach(acc => {
                const balance = getAccountBalance(acc.id, shop);
                if (acc.type === 'Asset') assets += balance > 0 && acc.normalBalance === 'Debit' ? balance : 0;
                else if (acc.type === 'Liability') liabilities += balance > 0 && acc.normalBalance === 'Credit' ? balance : 0;
                else if (acc.type === 'Equity') equity += balance > 0 && acc.normalBalance === 'Credit' ? balance : 0;
            });
            return { assets, liabilities, equity };
        }

        function integrateSale(invoice) {
            const lines = [];
            if (invoice.paymentMethod === 'Cash' || invoice.paymentMethod === 'eSewa' || invoice.paymentMethod === 'Bank Transfer') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash' || a.name === 'eSewa' || a.name === 'Bank');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: invoice.grandTotal, credit: 0 });
            } else {
                const recAcc = chartOfAccounts.find(a => a.name === 'Accounts Receivable');
                if (recAcc) lines.push({ accountId: recAcc.id, debit: invoice.grandTotal, credit: 0 });
            }
            const revAcc = chartOfAccounts.find(a => a.name === 'Sales');
            if (revAcc) lines.push({ accountId: revAcc.id, debit: 0, credit: invoice.grandTotal });
            if (invoice.tax > 0) {
                const taxAcc = chartOfAccounts.find(a => a.name === 'Tax Payable');
                if (taxAcc) lines.push({ accountId: taxAcc.id, debit: 0, credit: invoice.tax });
            }
            postJournalEntry(invoice.date, `Sale: ${invoice.invoiceNumber}`, invoice.id, lines, invoice.shop);
        }

        function integratePurchase(purchase) {
            const lines = [];
            const invAcc = chartOfAccounts.find(a => a.name === 'Inventory');
            if (invAcc) lines.push({ accountId: invAcc.id, debit: purchase.totalAmount, credit: 0 });
            if (purchase.paymentMethod === 'Cash' || purchase.paymentMethod === 'Bank Transfer') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash' || a.name === 'Bank');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: purchase.totalAmount });
            } else {
                const payAcc = chartOfAccounts.find(a => a.name === 'Accounts Payable');
                if (payAcc) lines.push({ accountId: payAcc.id, debit: 0, credit: purchase.totalAmount });
            }
            postJournalEntry(purchase.date, `Purchase: ${purchase.poNumber}`, purchase.id, lines, purchase.shop);
        }

        function integrateExpense(expense) {
            const lines = [];
            const expAcc = chartOfAccounts.find(a => a.name === expense.category || a.name === 'Other Expenses');
            if (!expAcc) {
                const newAcc = { id: 'E' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1),
                    code: '5' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1).padStart(3, '0'),
                    name: expense.category, type: 'Expense', normalBalance: 'Debit' };
                chartOfAccounts.push(newAcc);
                lines.push({ accountId: newAcc.id, debit: expense.amount, credit: 0 });
            } else {
                lines.push({ accountId: expAcc.id, debit: expense.amount, credit: 0 });
            }
            if (expense.paymentMethod === 'Cash') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: expense.amount });
            } else {
                const bankAcc = chartOfAccounts.find(a => a.name === 'Bank');
                if (bankAcc) lines.push({ accountId: bankAcc.id, debit: 0, credit: expense.amount });
            }
            postJournalEntry(expense.date, `Expense: ${expense.category}`, expense.id, lines);
        }

        // ============================================================
        // AUTH - LOGIN
        // ============================================================
        function login() {
            const username = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Enter username and password';
                errorEl.style.display = 'block';
                return;
            }

            let user = userAccounts.find(u => u.username === username && u.password === password);

            if (user) {
                if (user.status !== 'Active') {
                    errorEl.textContent = 'Account is deactivated. Contact admin.';
                    errorEl.style.display = 'block';
                    return;
                }

                const staff = staffMembers.find(s => s.id === user.staffId);
                const role = user.role || 'Staff';

                currentUser = {
                    id: user.id,
                    name: staff ? staff.name : user.fullName,
                    role: role,
                    username: user.username,
                    staffId: user.staffId,
                    assignedShops: user.assignedShops || []
                };

                user.lastLogin = new Date().toISOString();

                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';

                document.getElementById('userAvatar').textContent = currentUser.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('userRole').textContent = currentUser.role;

                initData();
                buildSidebar(currentUser.role);
                buildBottomNav(currentUser.role);
                navigateTo('dashboard');
                errorEl.style.display = 'none';
                addNotification(`User ${currentUser.name} logged in`, 'success');
                logAudit('LOGIN', `User ${currentUser.name} logged in`);
                return;
            }

            errorEl.textContent = 'Invalid username or password.';
            errorEl.style.display = 'block';
        }

        function logout() {
            if (currentUser) {
                addNotification(`User ${currentUser.name} logged out`, 'info');
                logAudit('LOGOUT', `User ${currentUser.name} logged out`);
            }
            currentUser = null;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
            closeSidebar();
        }

        // ============================================================
        // BUILD POSITION-BASED SIDEBAR
        // ============================================================
        function buildSidebar(role) {
            const menu = POSITION_MENUS[role] || POSITION_MENUS['Salesman'];
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;

            let html = '';
            menu.sections.forEach(section => {
                html += `<div class="nav-section">${section.name}</div>`;
                section.items.forEach(item => {
                    const target = NAV_TARGETS[item.id] || item.id;
                    html += `
                        <button class="nav-item" onclick="navigateTo('${target}')">
                            <span class="icon">${item.icon}</span> ${item.label}
                        </button>
                    `;
                });
            });
            nav.innerHTML = html;
        }

        function buildBottomNav(role) {
            const menu = POSITION_MENUS[role] || POSITION_MENUS['Salesman'];
            const nav = document.getElementById('bottomNav');
            if (!nav) return;

            // Take first 5 items from first section
            let items = [];
            if (menu.sections.length > 0) {
                items = menu.sections[0].items.slice(0, 5);
            }
            if (items.length < 5 && menu.sections.length > 1) {
                const extra = menu.sections[1].items.slice(0, 5 - items.length);
                items = items.concat(extra);
            }

            let html = '';
            items.forEach(item => {
                const target = NAV_TARGETS[item.id] || item.id;
                html += `
                    <button onclick="navigateTo('${target}')">
                        <span class="nav-icon">${item.icon}</span> ${item.label.substring(0, 6)}
                    </button>
                `;
            });
            nav.innerHTML = html;
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function navigateTo(section) {
            // Check if this section is allowed for the current user
            const role = currentUser?.role || 'Salesman';
            const menu = POSITION_MENUS[role] || POSITION_MENUS['Salesman'];
            let allowed = false;
            menu.sections.forEach(sec => {
                sec.items.forEach(item => {
                    if (NAV_TARGETS[item.id] === section) allowed = true;
                });
            });
            if (!allowed && role !== 'Super Admin') {
                showToast('⛔ Access Denied - This function is not available for your position', 'error');
                return;
            }

            document.getElementById('pageTitle').innerHTML = TITLES[section] || section;
            closeSidebar();

            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.remove('active'));

            // Highlight active sidebar item
            document.querySelectorAll('.sidebar .nav-item').forEach(el => {
                if (el.textContent.trim().toLowerCase().includes(TITLES[section]?.split(' ').slice(1).join(' ')?.toLowerCase() || '')) {
                    el.classList.add('active');
                }
            });

            // Render the section
            switch (section) {
                case 'dashboard': renderDashboard(); break;
                case 'search': renderSearch(); break;
                case 'pos': renderPOS(); break;
                case 'invoices': renderInvoices(); break;
                case 'products': renderProducts(); break;
                case 'inventory': renderInventory(); break;
                case 'shops': renderShops(); break;
                case 'purchases': renderPurchases(); break;
                case 'suppliers': renderSuppliers(); break;
                case 'manufacturing': renderManufacturing(); break;
                case 'transfers': renderTransfers(); break;
                case 'customers': renderCustomers(); break;
                case 'coa': renderCOA(); break;
                case 'salesAccounting': renderSalesAccounting(); break;
                case 'purchaseAccounting': renderPurchaseAccounting(); break;
                case 'cashbank': renderCashBank(); break;
                case 'expenses': renderExpenses(); break;
                case 'payroll': renderPayroll(); break;
                case 'tax': renderTax(); break;
                case 'priceTags': renderPriceTags(); break;
                case 'printTags': renderPrintTags(); break;
                case 'priceReports': renderPriceReports(); break;
                case 'reportsDashboard': renderReportsDashboard(); break;
                case 'salesReports': renderSalesReports(); break;
                case 'inventoryReports': renderInventoryReports(); break;
                case 'purchaseReports': renderPurchaseReports(); break;
                case 'transferReports': renderTransferReports(); break;
                case 'customerReports': renderCustomerReports(); break;
                case 'supplierReports': renderSupplierReports(); break;
                case 'financeReports': renderFinanceReports(); break;
                case 'branchReports': renderBranchReports(); break;
                case 'staffReports': renderStaffReports(); break;
                case 'manufacturingReports': renderManufacturingReports(); break;
                case 'businessAnalytics': renderBusinessAnalytics(); break;
                case 'auditReports': renderAuditReports(); break;
                case 'users': renderUsers(); break;
                case 'backup': renderBackup(); break;
                case 'settings': renderSettings(); break;
                case 'cashClosing': renderCashClosing(); break;
                default: renderDashboard();
            }
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function renderDashboard() {
            const totalSales = invoices.reduce((s, inv) => s + inv.grandTotal, 0);
            const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
            const netProfit = totalSales - totalExpenses;
            const totalStock = products.reduce((s, p) => s + (p.stock || 0), 0);
            const invValue = products.reduce((s, p) => s + ((p.stock || 0) * (p.costPrice || 0)), 0);
            const lowStock = products.filter(p => (p.stock || 0) <= (p.minStock || 5)).length;

            // Alerts
            const alerts = [];
            products.forEach(p => {
                if ((p.stock || 0) <= (p.minStock || 5)) {
                    alerts.push({ type: 'warning', message: `⚠️ Low stock: ${p.name} (${p.stock} left)` });
                }
                if ((p.stock || 0) === 0) {
                    alerts.push({ type: 'danger', message: `🚫 Out of stock: ${p.name}` });
                }
            });

            let html = `
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-label">💰 Total Sales</div><div class="kpi-value gold">${CURRENCY} ${totalSales.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">💸 Total Expenses</div><div class="kpi-value danger">${CURRENCY} ${totalExpenses.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">📈 Net Profit</div><div class="kpi-value ${netProfit>=0?'gold':'danger'}">${CURRENCY} ${netProfit.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">📦 Total Stock</div><div class="kpi-value">${totalStock}</div></div>
                    <div class="kpi-card"><div class="kpi-label">📦 Inventory Value</div><div class="kpi-value">${CURRENCY} ${invValue.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">⚠️ Low Stock</div><div class="kpi-value danger">${lowStock}</div></div>
                    <div class="kpi-card"><div class="kpi-label">🧾 Invoices</div><div class="kpi-value">${invoices.length}</div></div>
                    <div class="kpi-card"><div class="kpi-label">👥 Customers</div><div class="kpi-value">${customers.length}</div></div>
                </div>

                ${alerts.length > 0 ? `
                <div class="section-card">
                    <div class="card-title">🔔 Alerts <span class="badge">${alerts.length}</span></div>
                    ${alerts.map(a => `<div class="alert-item ${a.type}">${a.message}</div>`).join('')}
                </div>` : ''}

                <div class="section-card">
                    <div class="card-title">⚡ Quick Actions</div>
                    <div class="btn-group">
                        ${canAccess('pos') ? `<button class="btn btn-success" onclick="navigateTo('pos')">🛒 New Sale</button>` : ''}
                        ${canAccess('products') ? `<button class="btn btn-primary" onclick="navigateTo('products')">🏷️ Products</button>` : ''}
                        ${canAccess('purchases') ? `<button class="btn btn-warning" onclick="navigateTo('purchases')">📥 Purchases</button>` : ''}
                        ${canAccess('customers') ? `<button class="btn btn-secondary" onclick="navigateTo('customers')">👤 Customers</button>` : ''}
                        ${canAccess('inventory') ? `<button class="btn btn-secondary" onclick="navigateTo('inventory')">📦 Inventory</button>` : ''}
                    </div>
                </div>
            `;

            document.getElementById('pageContent').innerHTML = html;
        }

        // Helper: Check if current user can access a feature
        function canAccess(section) {
            if (!currentUser) return false;
            if (currentUser.role === 'Super Admin') return true;
            const menu = POSITION_MENUS[currentUser.role] || POSITION_MENUS['Salesman'];
            let allowed = false;
            menu.sections.forEach(sec => {
                sec.items.forEach(item => {
                    if (NAV_TARGETS[item.id] === section) allowed = true;
                });
            });

        function performSearch() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');
            if (!query) { results.innerHTML = '<p style="color:var(--text-light);">Enter a search term</p>'; return; }

            products.filter(p => p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (p.barcode && p.barcode.includes(query))).forEach(p => {
                items.push({ type: '📦 Product', name: p.name,

                items.push({ type: '👤 Customer', name: c.fullName,

                items.push({ type: '🧾 Invoice', name: inv.invoiceNumber,

            let html = `<div class="table-wrapper"><table><thead><tr><th>Type</th><th>Name</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
            items.slice(0, 20).forEach(item => {

                        <td>${item.detail}</td>

                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            results.innerHTML = html;
        }

        // POS Functions

                    `<div class="result-item" onclick="posSelectCustomer('${c.id}')">
                        <span>${c.fullName} - ${c.mobile}</span>
                        <span style="font-size:11px;color:var(--text-light);">${c.membershipLevel||'None'}</span>
                    </div>`
                ).join('');
            } else {
                results.innerHTML = `<div class="result-item" onclick="posCreateCustomer('${query}')">➕ Create new: ${query}</div>`;
            }

        function posSelectCustomer(id) {
            const c = customers.find(cu => cu.id === id);
            if (!c) return;
            document.getElementById('posCustomer').value = c.fullName;
            document.getElementById('posCustomerPhone').value = c.mobile;
            document.getElementById('posMembership').value = c.membershipLevel || 'None';
            document.getElementById('posCustomerResults').innerHTML = '';

        function posCreateCustomer(name) {
            const c = {
                id: 'C' + String(counters.customer++).padStart(3, '0'),
                fullName: name,
                mobile: '',
                email: '',
                address: '',
                membershipLevel: 'Regular',
                loyaltyPoints: 0,
                creditLimit: 0,
                totalPurchases: 0,
                dueBalance: 0,
                purchaseHistory: [],
                createdAt: new Date().toISOString()

            showToast('✅ New customer created', 'success');
            logAudit('CREATE_CUSTOMER', `Customer ${name} created`);

        function posSearchProduct() {
            const query = document.getElementById('posProductSearch').value.trim().toLowerCase();
            const results = document.getElementById('posProductResults');
            if (!query) { results.innerHTML = ''; return; }
            const matches = products.filter(p =>
                p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (p.barcode && p.barcode.includes(query))
            );
            if (!matches.length) { results.innerHTML = '<div class="result-item">No products found</div>'; return; }
            results.innerHTML = matches.slice(0, 8).map(p => {
                const img = (p.images && p.images.length) ? p.images[0] :
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                return `
                    <div class="result-item" onclick="posAddProduct('${p.id}')">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <img src="${img}" style="width:35px;height:35px;object-fit:cover;border-radius:4px;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'">
                            <div><div style="font-weight:600;font-size:13px;">${p.name}</div>
                            <div style="font-size:11px;color:var(--text-light);">${p.sku||''} | Stock: ${p.stock}</div></div>
                        </div>
                        <div style="font-weight:700;color:var(--gold);">${CURRENCY} ${p.sellingPrice}</div>
                    </div>
                `;
            }).join('');
        }

        function posQuickAdd(id) { posAddProduct(id); }

        function posAddProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) { showToast('Product not found', 'error'); return; }
            const qty = parseInt(document.getElementById('posQty').value) || 1;
            if (qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
            const existing = posCart.find(item => item.id === p.id);
            if (existing) {
                if (existing.qty + qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
                existing.qty += qty;
                existing.lineTotal = existing.qty * existing.price;
            } else {
                posCart.push({
                    id: p.id,
                    name: p.name,
                    sku: p.sku || '',
                    image: (p.images && p.images.length) ? p.images[0] : null,
                    price: p.sellingPrice,
                    qty: qty,
                    lineTotal: qty * p.sellingPrice,
                    stock: p.stock
                });
            }
            document.getElementById('posProductSearch').value = '';
            document.getElementById('posProductResults').innerHTML = '';
            document.getElementById('posPrice').value = p.sellingPrice;
            posUpdateCart();
            showToast(`✅ ${p.name} added`, 'success');
        }

        function posRemoveFromCart(idx) { posCart.splice(idx, 1); posUpdateCart(); }

        function posClearCart() { if (posCart.length && confirm('Clear cart?')) { posCart = []; posUpdateCart(); } }

        function posCancelSale() { if (posCart.length && confirm('Cancel this sale?')) { posCart = []; posUpdateCart(); showToast('❌ Sale cancelled', 'warning'); } }

        function posUpdateCart() {
            const container = document.getElementById('posCart');
            const count = document.getElementById('cartCount');
            if (!container) return;
            if (count) count.textContent = posCart.length;
            if (!posCart.length) {
                container.innerHTML = '<p style="color:var(--text-light);padding:10px;text-align:center;">Cart empty</p>';
                posCalcTotals();
                return;
            }
            let html = `<div class="table-wrapper"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>`;
            posCart.forEach((item, idx) => {
                html += `
                    <tr>
                        <td><strong>${item.name}</strong><br><span style="font-size:10px;color:var(--text-light);">${item.sku||''}</span></td>
                        <td><button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, -1)">-</button> ${item.qty} <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, 1)">+</button></td>
                        <td>${CURRENCY} ${item.price}</td>
                        <td>${CURRENCY} ${item.lineTotal.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${idx})">✕</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            posCalcTotals();
        }

        function posChangeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty < 1) return;
            const prod = products.find(p => p.id === item.id);
            if (prod && newQty > prod.stock) { showToast(`Insufficient stock! Available: ${prod.stock}`, 'error'); return; }
            item.qty = newQty;
            item.lineTotal = item.qty * item.price;
            posUpdateCart();
        }

        function posCalcTotals() {
            const subtotal = posCart.reduce((s, i) => s + i.lineTotal, 0);
            const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
            const taxRate = settings.taxRate || VAT_RATE;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const grandTotal = afterDiscount + tax;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const change = Math.max(0, paid - grandTotal);
            document.getElementById('posSubtotal').value = subtotal.toFixed(2);
            document.getElementById('posTax').value = tax.toFixed(2);
            document.getElementById('posGrandTotal').value = grandTotal.toFixed(2);
            document.getElementById('posChange').value = change.toFixed(2);
            document.getElementById('posStatus').value = (paid >= grandTotal) ? 'Paid' : 'Due';
        }

        function posCompleteSale() {
            if (!posCart.length) { showToast('Cart is empty', 'error'); return; }
            const customerName = document.getElementById('posCustomer').value || 'Walk-in Customer';
            const shop = document.getElementById('posShop').value || 'Store 1';
            const paymentMethod = document.getElementById('posPayment').value;
            const grandTotal = parseFloat(document.getElementById('posGrandTotal').value) || 0;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const status = paid >= grandTotal ? 'Paid' : 'Partial';
            const inv = {
                id: 'INV' + String(counters.invoice++).padStart(6, '0'),
                invoiceNumber: document.getElementById('posInvNumber').value,
                date: document.getElementById('posInvDate').value || new Date().toISOString().slice(0, 10),
                customerName: customerName,
                shop: shop,
                items: posCart.map(item => ({ ...item })),
                subtotal: parseFloat(document.getElementById('posSubtotal').value) || 0,
                discount: parseFloat(document.getElementById('posDiscount').value) || 0,
                tax: parseFloat(document.getElementById('posTax').value) || 0,
                grandTotal: grandTotal,
                paidAmount: paid,
                balanceDue: Math.max(0, grandTotal - paid),
                paymentMethod: paymentMethod,
                paymentStatus: status,
                status: 'Completed',
                createdAt: new Date().toISOString()
            };
            invoices.push(inv);
            posCart.forEach(item => {
                const prod = products.find(p => p.id === item.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - item.qty);
                    prod.salesCount = (prod.salesCount || 0) + item.qty;
                    if (shopInventory[prod.id]) {
                        shopInventory[prod.id][shop] = Math.max(0, (shopInventory[prod.id][shop] || 0) - item.qty);
                    }
                }
            });
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: 'Income',
                amount: grandTotal,
                description: `Invoice ${inv.invoiceNumber} - ${customerName}`,
                date: inv.date,
                reference: inv.id,
                paymentMethod: paymentMethod,
                createdAt: new Date().toISOString()
            });
            if (paymentMethod === 'eSewa') {
                esewa.balance = (esewa.balance || 0) + grandTotal;
            }
            const cust = customers.find(c => c.fullName === customerName);
            if (cust) {
                cust.totalPurchases = (cust.totalPurchases || 0) + grandTotal;
                cust.dueBalance = (cust.dueBalance || 0) + inv.balanceDue;
                const points = Math.floor(grandTotal / 100);
                cust.loyaltyPoints = (cust.loyaltyPoints || 0) + points;
            }
            settings.nextInvoiceNumber = (settings.nextInvoiceNumber || 1001) + 1;
            integrateSale(inv);
            logAudit('SALE', `Invoice ${inv.invoiceNumber} created for ${customerName} - ${CURRENCY} ${grandTotal}`);
            addNotification(`🧾 Invoice ${inv.invoiceNumber} created for ${customerName}`, 'success');
            posCart = [];
            posUpdateCart();
            showToast(`✅ Invoice ${inv.invoiceNumber} completed!`, 'success');
            renderInvoices();
            saveData(true);
        }

        function saveProduct(id) {
            const textarea = document.getElementById('prodImages');
            const images = textarea.value.split('\n').map(s => s.trim()).filter(s => s);

            const data = {
                id: id || 'P' + String(counters.product++).padStart(3, '0'),
                name: document.getElementById('prodName').value.trim(),
                sku: document.getElementById('prodSku').value.trim(),
                barcode: document.getElementById('prodBarcode').value.trim(),
                category: document.getElementById('prodCategory').value,
                brand: document.getElementById('prodBrand').value,
                color: document.getElementById('prodColor').value.trim(),
                size: document.getElementById('prodSize').value.trim(),
                material: document.getElementById('prodMaterial').value.trim(),
                costPrice: parseFloat(document.getElementById('prodCost').value) || 0,
                sellingPrice: parseFloat(document.getElementById('prodSell').value) || 0,
                wholesalePrice: 0,
                mrpPrice: parseFloat(document.getElementById('prodMrp').value) || 0,
                description: document.getElementById('prodDesc').value.trim(),
                images: images.slice(0, 5),
                status: document.getElementById('prodStatus').value,
                stock: parseInt(document.getElementById('prodStock').value) || 0,
                minStock: parseInt(document.getElementById('prodMinStock').value) || 5,
                maxStock: 100,
                warehouse: document.getElementById('prodWarehouse').value,
                salesCount: 0,
                supplier: '',
                createdAt: new Date().toISOString()
            };
            if (!data.name) { showToast('Product name is required', 'error'); return; }
            if (id) {
                const idx = products.findIndex(p => p.id === id);
                if (idx >= 0) { products[idx] = { ...products[idx], ...data }; }
            } else {
                products.push(data);
            }
            if (!shopInventory[data.id]) shopInventory[data.id] = {};
            shops.forEach(shop => {
                shopInventory[data.id][shop.shopName] = (shop.shopName === data.warehouse) ? data.stock : 0;
            });
            closeModal();
            showToast(`✅ Product ${data.name} saved`, 'success');
            logAudit('PRODUCT', `${id?'Updated':'Added'} product ${data.name}`);
            renderProducts();
            saveData(true);
        }

            const p = products.find(pr => pr.id === id);

        }

        function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const p = products.find(pr => pr.id === id);
            products = products.filter(pr => pr.id !== id);

            showToast(`🗑️ Product ${p?.name||''} deleted`, 'warning');

        function renderInventory() {
            if (!canAccess('inventory')) { showToast('⛔ Access Denied', 'error'); return; }
            const totalStock = products.reduce((s, p) => s + (p.stock || 0), 0);
            const invValue = products.reduce((s, p) => s + ((p.stock || 0) * (p.costPrice || 0)), 0);
            const lowItems = products.filter(p => (p.stock || 0) <= (p.minStock || 5));
            const outItems = products.filter(p => (p.stock || 0) === 0);
            const shopSummary = shops.map(shop => {
                const total = products.reduce((s, p) => {
                    const stock = shopInventory[p.id]?.[shop.shopName] || 0;
                    return s + stock;
                }, 0);
                const value = products.reduce((s, p) => {
                    const stock = shopInventory[p.id]?.[shop.shopName] || 0;
                    return s + (stock * (p.costPrice || 0));
                }, 0);
                return { ...shop, total, value };
            });

            let html = `
                <div class="section-card">
                    <div class="card-title">📦 Inventory Overview</div>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="kpi-label">Total Stock</div><div class="kpi-value">${totalStock}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Inventory Value</div><div class="kpi-value gold">${CURRENCY} ${invValue.toFixed(2)}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Low Stock</div><div class="kpi-value danger">${lowItems.length}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Out of Stock</div><div class="kpi-value danger">${outItems.length}</div></div>
                    </div>
                    <h4 style="margin:12px 0 8px;">🏪 Shop-wise Inventory</h4>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Shop</th><th>Total Items</th><th>Value</th></tr></thead>
                        <tbody>${shopSummary.map(s=>`<tr><td><strong>${s.shopName}</strong></td><td>${s.total}</td><td>${CURRENCY} ${s.value.toFixed(2)}</td></tr>`).join('')}</tbody></table>
                    </div>
                    <h4 style="margin:12px 0 8px;">📋 Product Stock</h4>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Product</th><th>Stock</th><th>Min</th></tr></thead>
                        <tbody>${products.slice(0,20).map(p=>`
                            <tr><td>${p.name}</td>
                                <td><span class="${(p.stock||0)<= (p.minStock||5)?'badge-low':(p.stock||0)===0?'badge-out':'badge-paid'}">${p.stock||0}</span></td>
                                <td>${p.minStock||5}</td>
                            </tr>
                        `).join('')}</tbody></table>
                    </div>

        function savePurchase() {
            const supplierId = document.getElementById('purchaseSupplier').value;
            const supplier = suppliers.find(s => s.id === supplierId);
            const supplierName = supplier ? supplier.supplierName : 'Unknown Supplier';
            const date = document.getElementById('purchaseDate').value || new Date().toISOString().slice(0, 10);
            const shop = document.getElementById('purchaseShop').value;
            const productName = document.getElementById('purchaseProduct').value.trim();
            const qty = parseInt(document.getElementById('purchaseQty').value) || 1;
            const cost = parseFloat(document.getElementById('purchaseCost').value) || 0;
            const payment = document.getElementById('purchasePayment').value;
            const status = document.getElementById('purchaseStatus').value;
            if (!productName) { showToast('Product name is required', 'error'); return; }
            const total = qty * cost;
            const po = {
                id: 'PO' + String(purchaseOrders.length + 1).padStart(6, '0'),
                poNumber: 'PO-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(purchaseOrders.length + 1).padStart(4, '0'),
                supplier: supplierId,
                supplierName: supplierName,
                date: date,
                shop: shop,
                items: [{ product: productName, qty, cost, total }],
                totalAmount: total,
                paymentMethod: payment,
                status: status,
                createdAt: new Date().toISOString()
            };
            purchaseOrders.push(po);
            purchases.push({ ...po, id: po.id });
            // Add to stock
            const existingProduct = products.find(p => p.name.toLowerCase() === productName.toLowerCase());
            if (existingProduct) {
                existingProduct.stock = (existingProduct.stock || 0) + qty;
                shopInventory[existingProduct.id][shop] = (shopInventory[existingProduct.id]?.[shop] || 0) + qty;
            }
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: 'Expense',
                amount: total,
                description: `Purchase ${po.poNumber} - ${supplierName}`,
                date: date,
                reference: po.id,
                paymentMethod: payment,
                createdAt: new Date().toISOString()
            });
            integratePurchase(po);
            closeModal();
            showToast(`📥 Purchase ${po.poNumber} saved`, 'success');
            logAudit('PURCHASE', `Purchase ${po.poNumber} from ${supplierName} for ${CURRENCY} ${total}`);
            renderPurchases();
            saveData(true);
        }

        function saveTransfer() {
            const prodId = document.getElementById('transferProduct').value;
            const qty = parseInt(document.getElementById('transferQty').value) || 1;
            const from = document.getElementById('transferFrom').value;
            const to = document.getElementById('transferTo').value;
            const date = document.getElementById('transferDate').value || new Date().toISOString().slice(0, 10);
            const status = document.getElementById('transferStatus').value;
            if (from === to) { showToast('From and To shops must be different', 'error'); return; }
            const product = products.find(p => p.id === prodId);
            if (!product) { showToast('Select a product', 'error'); return; }
            const fromStock = shopInventory[prodId]?.[from] || 0;
            if (fromStock < qty) { showToast(`Insufficient stock in ${from}. Available: ${fromStock}`, 'error'); return; }
            const transfer = {
                id: 'TRF' + String(shopTransfers.length + 1).padStart(6, '0'),
                transferNumber: 'TRF-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(shopTransfers.length + 1).padStart(4, '0'),
                productId: prodId,
                productName: product.name,
                qty: qty,
                fromShop: from,
                toShop: to,
                status: status,
                date: date,
                createdAt: new Date().toISOString()
            };
            shopTransfers.push(transfer);
            if (!shopInventory[prodId]) shopInventory[prodId] = {};
            shopInventory[prodId][from] = Math.max(0, (shopInventory[prodId][from] || 0) - qty);
            shopInventory[prodId][to] = (shopInventory[prodId][to] || 0) + qty;
            closeModal();
            showToast(`🚚 Transfer from ${from} to ${to} created`, 'success');
            logAudit('TRANSFER', `Stock transfer ${transfer.transferNumber} from ${from} to ${to} (${product.name} x${qty})`);
            renderTransfers();
            saveData(true);
        }

        function saveCashAccountingEntry() {
            const type = document.getElementById('cashEntryType').value;
            const amount = parseFloat(document.getElementById('cashEntryAmount').value) || 0;
            const date = document.getElementById('cashEntryDate').value || new Date().toISOString().slice(0, 10);
            const desc = document.getElementById('cashEntryDesc').value.trim() || 'Cash entry';
            const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
            if (!cashAcc) { showToast('Cash account not found', 'error'); return; }
            const lines = [];
            if (type === 'receive') {
                lines.push({ accountId: cashAcc.id, debit: amount, credit: 0 });
                const revAcc = chartOfAccounts.find(a => a.name === 'Sales');
                if (revAcc) lines.push({ accountId: revAcc.id, debit: 0, credit: amount });
            } else {
                lines.push({ accountId: cashAcc.id, debit: 0, credit: amount });

        function saveUser(id) {
            const data = {
                id: id || 'USR' + String(userAccounts.length + 1).padStart(3, '0'),
                username: document.getElementById('userUsername').value.trim(),
                fullName: document.getElementById('userFullName').value.trim(),
                email: document.getElementById('userEmail').value.trim(),
                password: document.getElementById('userPassword').value.trim() || 'user123',
                role: document.getElementById('userRole').value,
                status: document.getElementById('userStatus').value,
                staffId: '',
                lastLogin: null,
                createdAt: new Date().toISOString()
            };
            if (!data.username || !data.fullName) {
                showToast('Username and full name are required', 'error');
                return;
            }
            const existing = userAccounts.find(u => u.username === data.username && u.id !== id);
            if (existing) {
                showToast('⚠️ Username already exists', 'error');
                return;
            }
            if (id) {
                const idx = userAccounts.findIndex(u => u.id === id);
                if (idx >= 0) {
                    if (!document.getElementById('userPassword').value.trim()) {
                        data.password = userAccounts[idx].password;
                    }
                    userAccounts[idx] = { ...userAccounts[idx], ...data };
                }
            } else {
                userAccounts.push(data);
            }
            closeModal();
            showToast(`👤 User ${data.username} saved`, 'success');
            logAudit('USER', `${id?'Updated':'Added'} user ${data.username}`);
            renderUsers();
            saveData(true);
        }

        function editUser(id) {
            const u = userAccounts.find(usr => usr.id === id);
            if (u) openUserModal(u);
        }

        function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            const u = userAccounts.find(usr => usr.id === id);
            if (u?.username === 'admin') {
                showToast('Cannot delete Super Admin account', 'error');
                return;
            }
            userAccounts = userAccounts.filter(usr => usr.id !== id);
            showToast(`🗑️ User ${u?.username||''} deleted`, 'warning');
            logAudit('DELETE_USER', `Deleted user ${u?.username||id}`);
            renderUsers();
            saveData(true);
        }

        function renderBackup() {
            if (!canAccess('backup')) { showToast('⛔ Access Denied', 'error'); return; }
            let html = `
                <div class="section-card">
