<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>MS Bag Shop ERP v8.4 — Job-Based</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --primary: #0a1628;
            --primary-light: #1a3050;
            --secondary: #d4a843;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --gold: #d4a843;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --ai: #8b5cf6;
            --sidebar-width: 260px;
            --header-height: 60px;
            --red: #dc2626;
        }
        .dark-mode {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #2d3748;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* ===== LOGIN ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628, #1a3050);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(212, 168, 67, 0.05) 0%, transparent 70%);
            animation: rotateBg 60s linear infinite;
        }
        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        .dark-mode .login-card {
            background: rgba(26, 26, 46, 0.97);
        }
        .login-card .logo {
            text-align: center;
            font-size: 4rem;
        }
        .login-card h2 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
        }
        .dark-mode .login-card h2 {
            color: white;
        }
        .login-card h2 span {
            color: var(--gold);
        }
        .login-card .sub {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .login-card input,
        .login-card select {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .login-card input:focus,
        .login-card select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .login-card .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }
        .login-card .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(10, 22, 40, 0.3);
        }
        .login-error {
            color: #dc2626;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .login-role-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .login-role-badge.super-admin {
            background: #8b5cf6;
            color: white;
        }
        .login-role-badge.admin {
            background: #3b82f6;
            color: white;
        }
        .login-role-badge.manager {
            background: #10b981;
            color: white;
        }
        .login-role-badge.assistant {
            background: #f59e0b;
            color: white;
        }
        .login-role-badge.buyer {
            background: #06b6d4;
            color: white;
        }
        .login-role-badge.salesman {
            background: #ec4899;
            color: white;
        }
        .login-role-badge.cashier {
            background: #8b5cf6;
            color: white;
        }
        .login-role-badge.warehouse {
            background: #6b7280;
            color: white;
        }

        /* ===== APP ===== */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--primary);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        .app-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .left .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .app-header .left .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .left .brand {
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .app-header .left .brand span {
            color: var(--gold);
        }
        .app-header .left .brand small {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: 4px;
        }
        .app-header .center {
            flex: 1;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
            display: none;
        }
        .app-header .center input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 14px;
            transition: var(--transition);
        }
        .app-header .center input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .app-header .center input:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .app-header .center .icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .app-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header .right .btn-icon {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .right .btn-icon:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .right .btn-icon .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }
        .app-header .right .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: var(--transition);
        }
        .app-header .right .user-info:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .app-header .right .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .app-header .right .user-info .name {
            color: white;
            font-size: 13px;
            font-weight: 500;
        }
        .app-header .right .user-info .role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
        }
        .app-header .right .shop-select {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        .app-header .right .shop-select option {
            color: var(--text);
            background: var(--card);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--card);
            z-index: 200;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.08);
            padding-top: var(--header-height);
            border-right: 1px solid var(--border);
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar .inner {
            padding: 8px 0 80px;
        }
        .sidebar .brand-side {
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar .brand-side h2 {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
        }
        .sidebar .brand-side h2 span {
            color: var(--gold);
        }
        .sidebar .brand-side .ver {
            font-size: 9px;
            color: var(--text-light);
        }
        .sidebar .brand-side .user-role-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: var(--gold);
            color: white;
        }
        .sidebar .brand-side .user-branch {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
        }
        .sidebar .nav-section {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-light);
            padding: 14px 20px 4px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .sidebar .nav-item {
            display: block;
            width: 100%;
            padding: 9px 20px;
            background: none;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-weight: 500;
        }
        .sidebar .nav-item:hover {
            background: var(--bg);
            color: var(--primary);
        }
        .sidebar .nav-item.active {
            background: var(--bg);
            border-left-color: var(--gold);
            color: var(--primary);
        }
        .sidebar .nav-item .icon {
            margin-right: 10px;
            font-size: 15px;
        }
        .sidebar .nav-item .badge-nav {
            float: right;
            background: var(--gold);
            color: white;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
        }
        .sidebar .nav-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 20px;
        }
        .sidebar .nav-logout {
            color: var(--danger) !important;
        }
        .sidebar .nav-logout:hover {
            background: #fee2e2 !important;
        }
        .sidebar .nav-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .sidebar .nav-item .lock-icon {
            float: right;
            font-size: 11px;
            color: var(--text-light);
            opacity: 0.5;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            display: none;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show {
            display: block;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding-top: var(--header-height);
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 20px;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .page-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .page-header h1 small {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-light);
            margin-left: 6px;
        }
        .page-header .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-content {
            padding: 0 16px 16px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: none;
            justify-content: space-around;
            padding: 4px 0;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.08);
            z-index: 100;
            border-top: 1px solid var(--border);
        }
        .bottom-nav button {
            background: none;
            border: none;
            padding: 4px 6px;
            font-size: 9px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            transition: var(--transition);
        }
        .bottom-nav button .nav-icon {
            font-size: 18px;
        }
        .bottom-nav button.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== CARDS ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card);
            padding: 14px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .stat-card .stat-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
        .stat-card .stat-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .stat-card .stat-value.gold {
            color: var(--gold);
        }
        .stat-card .stat-value.danger {
            color: var(--danger);
        }
        .stat-card .stat-value.success {
            color: var(--success);
        }
        .stat-card .stat-value.ai {
            color: var(--ai);
        }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .section-card:hover {
            box-shadow: var(--shadow);
        }
        .section-card .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        .dark-mode .section-card .card-title {
            color: white;
        }
        .section-card .card-title .badge {
            background: var(--secondary);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: var(--card);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .kpi-card .kpi-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
        }
        .kpi-card .kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .kpi-card .kpi-value.gold {
            color: var(--gold);
        }
        .kpi-card .kpi-value.danger {
            color: var(--danger);
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group label .req {
            color: var(--danger);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .form-group input[readonly] {
            background: var(--border);
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .form-row-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
        }
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #d1d5db;
            transform: translateY(-1px);
        }
        .btn-gold {
            background: var(--gold);
            color: white;
        }
        .btn-gold:hover {
            transform: translateY(-1px);
        }
        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }
        .btn-ai:hover {
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        table th,
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }
        table th {
            background: var(--bg);
            font-weight: 700;
            color: var(--text-light);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;

        // ============================================================

        // ============================================================
        function userHasAccess(screenId) {
            // If super-admin, full access
            if (currentUser.role === 'super-admin') return true;

            const menu = ROLE_MENUS[currentUser.role];
            if (!menu) return false;

            for (const section of menu.sections) {
                for (const item of section.items) {
                    if (item.id === screenId) return true;
                }
            }
            return false;
        }

        function getAvailableScreens() {
            const menu = ROLE_MENUS[currentUser.role];
            if (!menu) return [];
            const screens = [];
            for (const section of menu.sections) {
                for (const item of section.items) {
                    screens.push(item.id);
                }
            }
            return screens;
        }

            if (currentBranch === 'all') return data;
            if (currentUser.role === 'super-admin') return data;
            return data.filter(item => item[branchField] === currentBranch);
        }

        function getBranchName(branchId) {
            const shop = shops.find(s => s.id === branchId);
            return shop ? shop.shopName : branchId;

            if (currentBranch === 'all') return 'All Branches';

            for (const section of menu.sections) {

                const visibleItems = section.items.filter(item => userHasAccess(item.id));
                if (visibleItems.length === 0) continue;

                html += `<div class="nav-section">${section.name}</div>`;
                for (const item of visibleItems) {

            const container = document.getElementById('bottomNav');
            const menu = ROLE_MENUS[currentUser.role];
            if (!menu) { container.innerHTML = ''; return; }

            // Pick up to 5 most important screens for bottom nav
            const priority = ['dashboard', 'pos', 'products', 'inventory', 'search'];
            const available = getAvailableScreens();
            const bottomItems = priority.filter(id => available.includes(id)).slice(0, 5);

            if (bottomItems.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (const id of bottomItems) {
                let label = id.charAt(0).toUpperCase() + id.slice(1);
                let icon = '📄';
                const menuItems = menu.sections.flatMap(s => s.items);
                const found = menuItems.find(i => i.id === id);
                if (found) {
                    label = found.label;
                    icon = found.icon;
                }
                const isActive = id === currentScreen;
                html += `
                    <button class="${isActive?'active':''}" onclick="navigateTo('${id}')">
                        <span class="nav-icon">${icon}</span> ${label}
                    </button>
                `;
            }
            container.innerHTML = html;
        }

            const allBranches = currentUser.role === 'super-admin' ? shops : shops.filter(s => available.includes(s.id));

            sel.innerHTML = '';
            if (currentUser.role === 'super-admin' || available.length > 1) {
                const opt = document.createElement('option');
                opt.value = 'all';
                opt.textContent = '🏪 All Branches';
                sel.appendChild(opt);
            }

            for (const shop of allBranches) {
                const opt = document.createElement('option');
                opt.value = shop.id;
                opt.textContent = `🏪 ${shop.shopName}`;
                if (currentBranch === shop.id) opt.selected = true;
                sel.appendChild(opt);
            }

            // If only one branch, select it automatically
            if (allBranches.length === 1 && currentBranch === 'all') {
                currentBranch = allBranches[0].id;
                sel.value = currentBranch;
            }

        // ============================================================
        // DASHBOARD (Branch-filtered)
        // ============================================================
        function renderDashboard() {
            if (!userHasAccess('dashboard')) { showToast('⛔ Access Denied', 'error'); return; }

            const branchFilteredInvoices = currentBranch === 'all' ? invoices : invoices.filter(inv => inv.shop ===
            currentBranch);
            const branchFilteredProducts = currentBranch === 'all' ? products : products.filter(p => {
                const stock = shopInventory[p.id]?.[currentBranch] || 0;
                return stock > 0;
            });

            const today = new Date().toISOString().slice(0, 10);
            const month = today.slice(0, 7);

            const totalSales = branchFilteredInvoices.reduce((s, inv) => s + inv.grandTotal, 0);
            const salesToday = branchFilteredInvoices.filter(inv => inv.date === today).reduce((s, inv) => s + inv
            .grandTotal, 0);
            const salesMonth = branchFilteredInvoices.filter(inv => inv.date.startsWith(month)).reduce((s, inv) => s + inv
                .grandTotal, 0);

            const totalStock = branchFilteredProducts.reduce((s, p) => {
                const st = currentBranch === 'all' ? (p.stock || 0) : (shopInventory[p.id]?.[currentBranch] || 0);
                return s + st;
            }, 0);

            const lowStock = branchFilteredProducts.filter(p => {
                const st = currentBranch === 'all' ? (p.stock || 0) : (shopInventory[p.id]?.[currentBranch] || 0);
                return st <= (p.minStock || 5) && st > 0;
            }).length;

            const outStock = branchFilteredProducts.filter(p => {
                const st = currentBranch === 'all' ? (p.stock || 0) : (shopInventory[p.id]?.[currentBranch] || 0);
                return st === 0;
            }).length;

            const branchName = getCurrentBranchName();

            let html = `

                    <div class="kpi-card"><div class="kpi-label">📆 Monthly Sales</div><div class="kpi-value">${CURRENCY} ${salesMonth.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">📊 Total Sales</div><div class="kpi-value">${CURRENCY} ${totalSales.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-label">📦 Total Stock</div><div class="kpi-value">${totalStock}</div></div>
                    <div class="kpi-card"><div class="kpi-label">⚠️ Low Stock</div><div class="kpi-value danger">${lowStock}</div></div>
                    <div class="kpi-card"><div class="kpi-label">🚫 Out of Stock</div><div class="kpi-value danger">${outStock}</div></div>
                    <div class="kpi-card"><div class="kpi-label">🧾 Invoices</div><div class="kpi-value">${branchFilteredInvoices.length}</div></div>
                    <div class="kpi-card"><div class="kpi-label">👥 Customers</div><div class="kpi-value">${customers.length}</div></div>
                </div>
                <div class="section-card">
                    <div class="card-title">⚡ Quick Actions</div>
                    <div class="btn-group">
                        ${userHasAccess('pos') ? `<button class="btn btn-success" onclick="navigateTo('pos')">🛒 New Sale</button>` : ''}
                        ${userHasAccess('products') ? `<button class="btn btn-primary" onclick="navigateTo('products')">🏷️ Products</button>` : ''}
                        ${userHasAccess('purchases') ? `<button class="btn btn-warning" onclick="navigateTo('purchases')">📥 Purchase</button>` : ''}
                        ${userHasAccess('transfers') ? `<button class="btn btn-ai" onclick="navigateTo('transfers')">🚚 Transfer</button>` : ''}
                        ${userHasAccess('customers') ? `<button class="btn btn-secondary" onclick="navigateTo('customers')">👤 Customers</button>` : ''}
                        ${userHasAccess('inventory') ? `<button class="btn btn-secondary" onclick="navigateTo('inventory')">📦 Stock</button>` : ''}
                        ${userHasAccess('printTags') ? `<button class="btn btn-gold" onclick="navigateTo('printTags')">🏷️ Print Tags</button>` : ''}

                </div>
            `;

            document.getElementById('pageContent').innerHTML = html;
        }

        function performSearch() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');
            if (!query) { results.innerHTML = '<p style="color:var(--text-light);">Enter a search term</p>'; return; }

            let items = [];

            products.filter(p => p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (
                    p.barcode && p.barcode.includes(query))).forEach(p => {
                const shopStock = shopInventory[p.id] || {};
                const stockInfo = Object.entries(shopStock).map(([shop, qty]) => `${shop}: ${qty}`).join(', ');
                const img = (p.images && p.images.length) ? p.images[0] :
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2230%22 height=%2230%22%3E%3Crect width=%2230%22 height=%2230%22 fill=%22%23ddd%22/%3E%3Ctext x=%2215%22 y=%2215%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                items.push({ type: '📦 Product', name: p.name,
                    detail: `${CURRENCY} ${p.sellingPrice} | Stock: ${p.stock} | ${stockInfo}`, link: 'products',
                    id: p.id, img: img });
            });

            customers.filter(c => c.fullName.toLowerCase().includes(query) || c.mobile.includes(query)).forEach(c => {
                items.push({ type: '👤 Customer', name: c.fullName,

            let html = `<div class="table-wrapper"><table><thead><tr><th>Image</th><th>Type</th><th>Name</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
            items.slice(0, 30).forEach(item => {

                html += `
                    <tr>

                        <td>${item.detail}</td>
                        <td><button class="btn btn-sm btn-secondary" onclick="navigateTo('${item.link}')">Go</button></td>

            });

            results.innerHTML = html;

        function getStockStatus(product) {
            const stock = product.stock || 0;
            const min = product.minStock || 5;
            if (stock === 0) return { label: 'Out of Stock', class: 'badge-out' };
            if (stock <= min) return { label: 'Low Stock', class: 'badge-low' };
            return { label: 'In Stock', class: 'badge-paid' };
        }

        function getShopName(shopId) {
            const shop = shops.find(s => s.id === shopId);

        // ============================================================
        // EXPORT HELPERS
        // ============================================================
        function exportToExcel(data, filename) {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + '.xlsx';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // LOGIN
        // ============================================================
        function login() {
            const username = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const roleSelect = document.getElementById('loginRole').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Enter username and password';
                errorEl.style.display = 'block';
                return;
            }

            // Find user in userAccounts
            let user = userAccounts.find(u => u.username === username && u.password === password);

            // If no user found, use the role selector to simulate
            if (!user) {
                // Create a simulated user for the selected role
                const roleMap = {
                    'super-admin': 'Super Admin',
                    'admin': 'Admin',
                    'manager': 'Store Manager',
                    'assistant': 'Assistant Manager',
                    'buyer': 'Buyer',
                    'salesman': 'Salesman',
                    'cashier': 'Cashier',
                    'warehouse': 'Warehouse User'
                };
                const roleLabel = roleMap[roleSelect] || 'Super Admin';

                // Check if we have a default user with this role
                const defaultUser = userAccounts.find(u => u.role === roleSelect);
                if (defaultUser) {
                    user = defaultUser;
                } else {
                    // Create a temporary user
                    const staffId = 'STF' + String(staffMembers.length + 1).padStart(3, '0');
                    const userId = 'USR' + String(userAccounts.length + 1).padStart(3, '0');

                    const assignedBranches = shops.map(s => s.id);

                    user = {
                        id: userId,
                        username: username,
                        fullName: roleLabel + ' User',
                        role: roleSelect,
                        email: username + '@msbagshop.com',
                        password: password || 'password',
                        status: 'Active',
                        staffId: staffId,
                        permissions: 'edit',
                        assignedShops: assignedBranches,
                        createdAt: new Date().toISOString()
                    };
                    userAccounts.push(user);

                    const staff = {
                        id: staffId,
                        employeeId: 'EMP-' + String(staffMembers.length + 1).padStart(4, '0'),
                        name: roleLabel + ' User',
                        position: roleLabel,
                        department: 'Operations',
                        mobile: '+977 9800000000',
                        email: user.email,
                        salary: 0,
                        joiningDate: new Date().toISOString().slice(0, 10),
                        status: 'Active',
                        role: roleLabel,
                        shift: 'Morning',
                        username: username,
                        password: password || 'password',
                        userAccount: userId,
                        assignedShops: assignedBranches,
                        createdAt: new Date().toISOString()
                    };
                    staffMembers.push(staff);
                    saveData();
                }
            }

            if (user) {
                if (user.status !== 'Active') {
                    errorEl.textContent = 'Account is deactivated. Contact admin.';
                    errorEl.style.display = 'block';
                    return;
                }

                const staff = staffMembers.find(s => s.id === user.staffId);
                const assignedBranches = user.assignedShops || staff?.assignedShops || [];

                currentUser = {
                    id: user.id,
                    name: staff ? staff.name : user.fullName,
                    role: user.role,
                    roleLabel: getRoleLabel(user.role),
                    staffId: user.staffId,
                    username: user.username,
                    assignedBranches: assignedBranches,
                    branchId: assignedBranches.length === 1 ? assignedBranches[0] : null
                };

                // Set default branch
                if (assignedBranches.length === 1) {
                    currentBranch = assignedBranches[0];
                } else {
                    currentBranch = 'all';
                }

                user.lastLogin = new Date().toISOString();

                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';

                const avatar = document.getElementById('userAvatar');
                const nameEl = document.getElementById('userName');
                const roleEl = document.getElementById('userRole');

                avatar.textContent = currentUser.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                nameEl.textContent = currentUser.name;
                roleEl.textContent = getRoleLabel(currentUser.role);

                // Build UI
                populateBranchSelector();
                buildSidebar();
                buildBottomNav();

                errorEl.style.display = 'none';
                addNotification(`User ${currentUser.name} (${getRoleLabel(currentUser.role)}) logged in`, 'success');
                logAudit('LOGIN', `User ${currentUser.name} logged in as ${currentUser.role}`);

                navigateTo('dashboard');
                return;
            }

            // Fallback: use hardcoded admin
            if (username === 'admin' && password === 'admin123') {
                currentUser = {
                    id: 'USR001',
                    name: 'Super Admin',
                    role: 'super-admin',
                    roleLabel: 'Super Admin',
                    staffId: 'STF001',
                    username: 'admin',
                    assignedBranches: shops.map(s => s.id),
                    branchId: null
                };
                currentBranch = 'all';

                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('userAvatar').textContent = 'SA';
                document.getElementById('userName').textContent = 'Super Admin';
                document.getElementById('userRole').textContent = 'Super Admin';

                populateBranchSelector();
                buildSidebar();
                buildBottomNav();

                errorEl.style.display = 'none';
                addNotification('Super Admin logged in', 'success');
                logAudit('LOGIN', 'Super Admin logged in');
                navigateTo('dashboard');
                return;
            }

            errorEl.textContent = 'Invalid username or password.';
            errorEl.style.display = 'block';
        }

        // ============================================================
        // DATA MANAGEMENT
        // ============================================================
        function saveData() {
            try {
                const data = {
                    products, customers, suppliers, invoices, purchases, purchaseOrders,
                    productionOrders, shopTransfers, expenses, transactions, stockMovements,
                    staffMembers, userAccounts, members, galleries, priceHistory, backups,
                    notifications, settings, shopInventory, auditLogs, esewa, counters,
                    labelTemplates, printHistory, shops,
                    chartOfAccounts, journalEntries, payroll, taxRecords,
                    priceTagSettings,
                    lastSaved: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                updateAutoSaveIndicator('💾 Auto-Saved');
                return true;
            } catch (e) {
                console.warn('Save failed:', e);
                return false;
            }
        }

        function updateAutoSaveIndicator(msg) {
            const el = document.getElementById('autoSaveIndicator');
            if (el) { el.textContent = msg;
                el.classList.add('saved');
                setTimeout(() => el.classList.remove('saved'), 3000); }
        }

        function addNotification(msg, type = 'info') {
            notifications.unshift({ id: Date.now(), message: msg, type, time: 'Just now', read: false });
            updateNotificationBadge();
            saveData();
        }

        function updateNotificationBadge() {
            const unread = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifBadge');
            if (badge) { badge.textContent = unread;
                badge.style.display = unread > 0 ? 'block' : 'none'; }
        }

        function showNotifications() {
            let html = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-size:14px;font-weight:600;">🔔 Notifications (${notifications.filter(n=>!n.read).length} unread)</span>
                    ${notifications.length > 0 ? `<button class="notif-clear-btn" onclick="clearAllNotifications()">🗑️ Clear All</button>` : ''}
                </div>
            `;

            if (notifications.length === 0) {
                html += '<p style="color:var(--text-light);text-align:center;padding:20px;">No notifications</p>';
            } else {
                html += notifications.map(n =>
                    `<div style="padding:8px 12px;border-bottom:1px solid var(--border);${n.read?'opacity:0.6;':''}">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span>${n.message}</span>
                            <div style="display:flex;gap:6px;align-items:center;">
                                <span style="font-size:10px;color:var(--text-light);">${n.time}</span>
                                ${!n.read?`<button class="btn btn-sm btn-secondary" onclick="markNotificationRead(${n.id})" style="font-size:9px;padding:2px 8px;">Read</button>`:''}
                            </div>
                        </div>
                    </div>`
                ).join('');
            }

            openModal('🔔 Notifications', html);
        }

        function clearAllNotifications() {
            notifications = [];
            updateNotificationBadge();
            saveData();
            showNotifications();
            showToast('🗑️ All notifications cleared', 'success');
        }

        function markNotificationRead(id) {
            const n = notifications.find(notif => notif.id === id);
            if (n) { n.read = true;
                updateNotificationBadge();
                saveData();
                showNotifications(); }
        }

                });
            });
        }

        function getAccountBalance(accountId) {
            let balance = 0;
            const account = chartOfAccounts.find(a => a.id === accountId);
            if (!account) return 0;
            journalEntries.forEach(entry => {
                const line = entry.lines.find(l => l.accountId === accountId);
                if (line) {
                    if (account.normalBalance === 'Debit') {
                        balance += (line.debit || 0) - (line.credit || 0);
                    } else {
                        balance += (line.credit || 0) - (line.debit || 0);
                    }
                }
            });
            return balance;
        }

        function getProfitAndLoss(period = 'month') {
            const today = new Date().toISOString().slice(0, 10);
            const month = today.slice(0, 7);
            const year = today.slice(0, 4);

            let filteredEntries = journalEntries;
            if (period === 'today') {
                filteredEntries = filteredEntries.filter(e => e.date === today);
            } else if (period === 'month') {
                filteredEntries = filteredEntries.filter(e => e.date.startsWith(month));
            } else if (period === 'year') {
                filteredEntries = filteredEntries.filter(e => e.date.startsWith(year));
            }

            let revenue = 0,
                cogs = 0,
                expenses2 = 0;
            filteredEntries.forEach(entry => {
                entry.lines.forEach(line => {
                    const acc = chartOfAccounts.find(a => a.id === line.accountId);
                    if (!acc) return;
                    const amount = (line.credit || 0) - (line.debit || 0);
                    if (acc.type === 'Income') revenue += amount;
                    else if (acc.type === 'Expense') {
                        if (acc.name === 'Inventory') cogs += Math.abs(amount);
                        else expenses2 += Math.abs(amount);
                    }
                });
            });
            const grossProfit = revenue - cogs;
            const netProfit = grossProfit - expenses2;
            return { revenue, cogs, expenses: expenses2, grossProfit, netProfit };
        }

        function getBalanceSheet() {
            let assets = 0,
                liabilities = 0,
                equity = 0;
            chartOfAccounts.forEach(acc => {
                const bal = getAccountBalance(acc.id);
                if (acc.type === 'Asset') assets += Math.abs(bal);
                else if (acc.type === 'Liability') liabilities += Math.abs(bal);
            });
            const pnl = getProfitAndLoss('all');
            equity = pnl.netProfit;
            return { assets, liabilities, equity };
        }

        function postJournalEntry(date, description, reference, lines) {
            const entry = {
                id: 'JE' + String(journalEntries.length + 1).padStart(6, '0'),
                date: date || new Date().toISOString().slice(0, 10),
                description: description,
                reference: reference,
                lines: lines,
                createdAt: new Date().toISOString()
            };
            journalEntries.push(entry);
            saveData();
            return entry;
        }

        function integrateSale(invoice) {
            const lines = [];
            const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
            const bankAcc = chartOfAccounts.find(a => a.name === 'Bank');
            const revAcc = chartOfAccounts.find(a => a.name === 'Product Sales');
            const taxAcc = chartOfAccounts.find(a => a.name === 'Tax Payable');

            if (invoice.paymentMethod === 'Cash' || invoice.paymentMethod === 'eSewa' || invoice.paymentMethod ===
                'Bank Transfer') {
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: invoice.grandTotal, credit: 0 });
            } else {
                const recAcc = chartOfAccounts.find(a => a.name === 'Customer Receivable');
                if (!recAcc) {
                    const newAcc = { id: 'A7', code: '1070', name: 'Customer Receivable', type: 'Asset',
                        normalBalance: 'Debit' };
                    chartOfAccounts.push(newAcc);
                    lines.push({ accountId: newAcc.id, debit: invoice.grandTotal, credit: 0 });
                } else {
                    lines.push({ accountId: recAcc.id, debit: invoice.grandTotal, credit: 0 });
                }
            }
            if (revAcc) lines.push({ accountId: revAcc.id, debit: 0, credit: invoice.grandTotal });
            if (invoice.tax > 0 && taxAcc) lines.push({ accountId: taxAcc.id, debit: 0, credit: invoice.tax });
            postJournalEntry(invoice.date, `Sale: ${invoice.invoiceNumber}`, invoice.id, lines);
        }

        function integratePurchase(purchase) {
            const lines = [];
            const invAcc = chartOfAccounts.find(a => a.name === 'Inventory');
            if (invAcc) lines.push({ accountId: invAcc.id, debit: purchase.totalAmount, credit: 0 });

            if (purchase.paymentMethod === 'Cash' || purchase.paymentMethod === 'Bank Transfer') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
                const bankAcc = chartOfAccounts.find(a => a.name === 'Bank');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: purchase.totalAmount });
                else if (bankAcc) lines.push({ accountId: bankAcc.id, debit: 0, credit: purchase.totalAmount });
            } else {
                const payAcc = chartOfAccounts.find(a => a.name === 'Supplier Payable');
                if (payAcc) lines.push({ accountId: payAcc.id, debit: 0, credit: purchase.totalAmount });
            }
            postJournalEntry(purchase.date, `Purchase: ${purchase.poNumber}`, purchase.id, lines);
        }

        function integrateExpense(expense) {
            const lines = [];
            const expAcc = chartOfAccounts.find(a => a.name === expense.category);
            if (!expAcc) {
                const newAcc = { id: 'E' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1),
                    code: '5' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1).padStart(3, '0'),
                    name: expense.category, type: 'Expense', normalBalance: 'Debit' };
                chartOfAccounts.push(newAcc);
                lines.push({ accountId: newAcc.id, debit: expense.amount, credit: 0 });
            } else {
                lines.push({ accountId: expAcc.id, debit: expense.amount, credit: 0 });
            }

            if (expense.paymentMethod === 'Cash') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: expense.amount });
            } else {
                const bankAcc = chartOfAccounts.find(a => a.name === 'Bank');
                if (bankAcc) lines.push({ accountId: bankAcc.id, debit: 0, credit: expense.amount });
            }
            postJournalEntry(expense.date, `Expense: ${expense.category}`, expense.id, lines);
        }

                            <img src="${img}" style="width:35px;height:35px;object-fit:cover;border-radius:4px;" class="product-thumb" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'">
                            <div><div style="font-weight:600;font-size:13px;">${p.name}</div>
                            <div style="font-size:11px;color:var(--text-light);">${p.sku||''} | Stock: ${stock}</div></div>
                        </div>
                        <div style="font-weight:700;color:var(--gold);">${CURRENCY} ${p.sellingPrice}</div>
                    </div>
                `;
            }).join('');
        }

        function posQuickAdd(id) { posAddProduct(id); }

        function posAddProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) { showToast('Product not found', 'error'); return; }
            const qty = parseInt(document.getElementById('posQty').value) || 1;
            const stock = shopInventory[p.id]?.[currentBranch] || 0;
            if (qty > stock) { showToast(`Insufficient stock! Available: ${stock}`, 'error'); return; }
            const existing = posCart.find(item => item.id === p.id);
            if (existing) {
                if (existing.qty + qty > stock) { showToast(`Insufficient stock! Available: ${stock}`, 'error'); return; }
                existing.qty += qty;
                existing.lineTotal = existing.qty * existing.price;
            } else {
                posCart.push({
                    id: p.id,
                    name: p.name,
                    sku: p.sku || '',
                    image: (p.images && p.images.length) ? p.images[0] : null,
                    price: p.sellingPrice,
                    qty: qty,
                    lineTotal: qty * p.sellingPrice,
                    stock: stock
                });
            }
            document.getElementById('posProductSearch').value = '';
            document.getElementById('posProductResults').innerHTML = '';
            document.getElementById('posPrice').value = p.sellingPrice;
            posUpdateCart();
            showToast(`✅ ${p.name} added`, 'success');
        }

        function posRemoveFromCart(idx) { posCart.splice(idx, 1);
            posUpdateCart(); }

        function posClearCart() { if (posCart.length && confirm('Clear cart?')) { posCart = [];
                posUpdateCart(); } }

        function posCancelSale() { if (posCart.length && confirm('Cancel this sale?')) { posCart = [];
                posUpdateCart();
                showToast('❌ Sale cancelled', 'warning'); } }

        function posUpdateCart() {
            const container = document.getElementById('posCart');
            const count = document.getElementById('cartCount');
            if (!container) return;
            if (count) count.textContent = posCart.length;
            if (!posCart.length) {
                container.innerHTML = '<p style="color:var(--text-light);padding:10px;text-align:center;">Cart empty</p>';
                posCalcTotals();
                return;
            }
            let html = `<div class="table-wrapper"><table><thead><tr><th>Image</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>`;
            posCart.forEach((item, idx) => {
                const img = item.image ||
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                html += `
                    <tr>
                        <td><div class="product-thumb" style="width:35px;height:35px;border-radius:4px;overflow:hidden;"><img src="${img}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'"></div></td>
                        <td><strong>${item.name}</strong><br><span style="font-size:10px;color:var(--text-light);">${item.sku||''}</span></td>
                        <td><button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, -1)">-</button> ${item.qty} <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, 1)">+</button></td>
                        <td>${CURRENCY} ${item.price}</td>
                        <td>${CURRENCY} ${item.lineTotal.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${idx})">✕</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            posCalcTotals();
        }

        function posChangeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty < 1) return;
            const stock = shopInventory[item.id]?.[currentBranch] || 0;
            if (newQty > stock) { showToast(`Insufficient stock! Available: ${stock}`, 'error'); return; }
            item.qty = newQty;
            item.lineTotal = item.qty * item.price;
            posUpdateCart();
        }

        function posCalcTotals() {
            const subtotal = posCart.reduce((s, i) => s + i.lineTotal, 0);
            const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
            const taxRate = settings.taxRate || VAT_RATE;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const grandTotal = afterDiscount + tax;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const change = Math.max(0, paid - grandTotal);
            document.getElementById('posSubtotal').value = subtotal.toFixed(2);
            document.getElementById('posTax').value = tax.toFixed(2);
            document.getElementById('posGrandTotal').value = grandTotal.toFixed(2);
            document.getElementById('posChange').value = change.toFixed(2);
            document.getElementById('posStatus').value = (paid >= grandTotal) ? 'Paid' : 'Due';
            document.getElementById('posPoints').value = Math.floor(grandTotal / 100);
        }

        function posCompleteSale() {
            if (!posCart.length) { showToast('Cart is empty', 'error'); return; }
            const customerName = document.getElementById('posCustomer').value || 'Walk-in Customer';
            const shop = currentBranch === 'all' ? (document.getElementById('posShop').value || 'Thamel Shop') :
                getCurrentBranchName();
            const paymentMethod = document.getElementById('posPayment').value;
            const grandTotal = parseFloat(document.getElementById('posGrandTotal').value) || 0;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const status = paid >= grandTotal ? 'Paid' : 'Partial';
            const inv = {
                id: 'INV' + String(counters.invoice++).padStart(6, '0'),
                invoiceNumber: document.getElementById('posInvNumber').value,
                date: document.getElementById('posInvDate').value || new Date().toISOString().slice(0, 10),
                customerName: customerName,
                shop: shop,
                items: posCart.map(item => ({ ...item })),
                subtotal: parseFloat(document.getElementById('posSubtotal').value) || 0,
                discount: parseFloat(document.getElementById('posDiscount').value) || 0,
                tax: parseFloat(document.getElementById('posTax').value) || 0,
                grandTotal: grandTotal,
                paidAmount: paid,
                balanceDue: Math.max(0, grandTotal - paid),
                paymentMethod: paymentMethod,
                paymentStatus: status,
                status: 'Completed',
                createdAt: new Date().toISOString()
            };
            invoices.push(inv);
            posCart.forEach(item => {
                const prod = products.find(p => p.id === item.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - item.qty);
                    prod.salesCount = (prod.salesCount || 0) + item.qty;
                    if (shopInventory[prod.id]) {
                        shopInventory[prod.id][shop] = Math.max(0, (shopInventory[prod.id][shop] || 0) - item.qty);
                    }
                }
            });
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: 'Income',
                amount: grandTotal,
                description: `Invoice ${inv.invoiceNumber} - ${customerName}`,
                date: inv.date,
                reference: inv.id,
                paymentMethod: paymentMethod,
                createdAt: new Date().toISOString()
            });
            if (paymentMethod === 'eSewa') {
                esewa.balance = (esewa.balance || 0) + grandTotal;
            }
            const cust = customers.find(c => c.fullName === customerName);
            if (cust) {
                cust.totalPurchases = (cust.totalPurchases || 0) + grandTotal;
                cust.dueBalance = (cust.dueBalance || 0) + inv.balanceDue;
                const points = Math.floor(grandTotal / 100);
                cust.loyaltyPoints = (cust.loyaltyPoints || 0) + points;
            }
            settings.nextInvoiceNumber = (settings.nextInvoiceNumber || 1001) + 1;
            integrateSale(inv);
            logAudit('SALE', `Invoice ${inv.invoiceNumber} created for ${customerName} - ${CURRENCY} ${grandTotal}`);
            addNotification(`🧾 Invoice ${inv.invoiceNumber} created for ${customerName}`, 'success');
            posCart = [];
            posUpdateCart();
            showToast(`✅ Invoice ${inv.invoiceNumber} completed!`, 'success');
            if (userHasAccess('invoices')) renderInvoices();
            else renderPOS();
            saveData();
        }

        function posHoldSale() {

            const hold = {
                id: 'HOLD' + Date.now(),

            if (!heldSales.length) { showToast('No held sales', 'warning'); return; }
            const html = heldSales.map((h, i) =>

                </div>`
            ).join('');

        function posResumeHeld(idx) {
            const hold = heldSales[idx];

            showToast('✅ Sale resumed', 'success');

                        <select id="productCategoryFilter" onchange="filterProducts()"><option value="all">All Categories</option>${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
                        <select id="productStatusFilter" onchange="filterProducts()"><option value="all">All Status</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
                    </div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Category</th><th>Cost</th><th>Sell</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="productsTableBody">${branchProducts.length===0?'<tr><td colspan="9" class="empty-row">No products</td></tr>':''}</tbody></table>
                    </div>
                </div>
            `;
            document.getElementById('pageContent').innerHTML = html;
            window._branchProducts = branchProducts;
            filterProducts();
        }

        function filterProducts() {
            const search = document.getElementById('productSearch')?.value?.toLowerCase() || '';
            const cat = document.getElementById('productCategoryFilter')?.value || 'all';
            const status = document.getElementById('productStatusFilter')?.value || 'all';
            const bp = window._branchProducts || products;
            const tbody = document.getElementById('productsTableBody');
            if (!tbody) return;
            let filtered = bp.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || (p.sku && p.sku.toLowerCase().includes(
                    search)) || (p.barcode && p.barcode.includes(search));
                const matchCat = cat === 'all' || p.category === cat;
                const matchStatus = status === 'all' || p.status === status;
                return matchSearch && matchCat && matchStatus;
            });
            if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty-row">No products match</td></tr>'; return; }
            tbody.innerHTML = filtered.map(p => {
                const stock = currentBranch === 'all' ? (p.stock || 0) : (shopInventory[p.id]?.[currentBranch] || 0);
                const img = (p.images && p.images.length) ? p.images[0] :
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%23ddd%22/%3E%3Ctext x=%2220%22 y=%2220%22 font-size=%2220%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                return `
                    <tr>
                        <td><div class="product-thumb" style="width:40px;height:40px;border-radius:4px;overflow:hidden;"><img src="${img}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Crect width=%2240%22 height=%2240%22 fill=%22%23ddd%22/%3E%3Ctext x=%2220%22 y=%2220%22 font-size=%2220%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'"></div></td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.sku||'-'}</td>
                        <td>${p.category||'-'}</td>
                        <td>${CURRENCY} ${p.costPrice||0}</td>
                        <td style="color:var(--gold);font-weight:600;">${CURRENCY} ${p.sellingPrice||0}</td>
                        <td><span class="${stock<= (p.minStock||5)?'badge-low':stock===0?'badge-out':'badge-paid'}">${stock}</span></td>
                        <td><span class="badge-status ${p.status==='Active'?'badge-paid':'badge-inactive'}">${p.status}</span></td>
                        <td>
                            ${userHasAccess('products') ? `<button class="btn btn-sm btn-secondary" onclick="editProduct('${p.id}')">✏️</button>` : ''}
                            ${userHasAccess('products') ? `<button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button>` : ''}
                            ${userHasAccess('printTags') ? `<button class="btn btn-sm btn-gold" onclick="quickPrintTag('${p.id}')">🏷️</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function quickPrintTag(id) {
            const p = products.find(pr => pr.id === id);
            if (p) {
                const tagHtml = generatePriceTagHTML(p, 'A6');
                openModal(`🏷️ Price Tag: ${p.name}`, tagHtml);
                setTimeout(() => {
                    const barcodeEl = document.getElementById('quickTagBarcode');
                    if (barcodeEl) {
                        try { JsBarcode(barcodeEl, p.barcode || p.id, { format: 'EAN13', width: 2, height: 40,
                                displayValue: true }); } catch (e) {}
                    }
                }, 200);
            }
        }

                .mrpPrice) * 100) : 0;

            const margin = product.costPrice > 0 ? (profit / product.costPrice * 100).toFixed(1) : 0;

            return `
                <div class="price-tag-preview" style="max-width:${size==='A4'?'800px':size==='A5'?'600px':size==='A6'?'450px':'350px'};">

                                <img src="${img}" class="tag-product-image" style="max-width:100%;max-height:${size==='A4'?'200px':size==='A5'?'150px':'120px'};">
                            </div>
                            <div style="flex:1;min-width:150px;">
                                <div class="tag-product-name" style="font-size:${size==='A4'?'24px':size==='A5'?'20px':'16px'};text-align:left;">${product.name}</div>
                                <div class="tag-product-details" style="text-align:left;font-size:${size==='A4'?'14px':size==='A5'?'12px':'11px'};">
                                    <div><strong>Brand:</strong> ${product.brand||'MS'}</div>
                                    <div><strong>SKU:</strong> ${product.sku||product.id}</div>
                                    <div><strong>Color:</strong> ${product.color||'N/A'} | <strong>Size:</strong> ${product.size||'N/A'}</div>

                                </div>
                            </div>

                            ${product.mrpPrice > product.sellingPrice ? `<div><span class="tag-price-old">${CURRENCY} ${product.mrpPrice}</span></div>` : ''}
                            <div class="${discount>0?'tag-price-red':'tag-price-new'}" style="font-size:${size==='A4'?'48px':size==='A5'?'36px':'28px'};">
                                ${CURRENCY} ${product.sellingPrice}

                            ${size!=='A7' ? `<div style="font-size:11px;color:#666;margin-top:4px;">MRP: ${CURRENCY} ${product.mrpPrice} | Profit: ${CURRENCY} ${profit} (${margin}%)</div>` : ''}
                        </div>
                        <div class="tag-barcode" style="margin-top:6px;">
                            <svg id="quickTagBarcode"></svg>
                        </div>
                        <div class="tag-footer" style="font-size:${size==='A4'?'12px':size==='A5'?'10px':'9px'};">
                            ${COMPANY} | ${ADDRESS} | ${PHONE}
                        </div>
                    </div>
                    <div style="text-align:center;margin-top:8px;">

                        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button>
                    </div>
                </div>
            `;
