<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>MS Bag Shop – Enterprise ERP v8.0</title>

    <!-- ===== LIBRARIES ===== -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>

    <style>
        /* ===== COMPLETE CSS ===== */
        :root {
            --primary: #0a1628;
            --primary-light: #1a3050;
            --secondary: #d4a843;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --gold: #d4a843;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --ai: #8b5cf6;
            --sidebar-width: 260px;
            --header-height: 60px;
            --red: #dc2626;
            --red-dark: #991b1b;
        }
        .dark-mode {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #2d3748;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* ===== LOGIN ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628, #1a3050);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(212,168,67,0.05) 0%, transparent 70%);
            animation: rotateBg 60s linear infinite;
        }
        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }
        .dark-mode .login-card { background: rgba(26,26,46,0.97); }
        .login-card .logo { text-align: center; font-size: 4rem; }
        .login-card h2 { text-align: center; color: var(--primary); font-size: 1.8rem; font-weight: 700; }
        .dark-mode .login-card h2 { color: white; }
        .login-card h2 span { color: var(--gold); }
        .login-card .sub { text-align: center; font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
        .login-card input, .login-card select {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .login-card input:focus, .login-card select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212,168,67,0.1);
        }
        .login-card .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }
        .login-card .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(10,22,40,0.3); }
        .login-error { color: #dc2626; text-align: center; margin-top: 10px; display: none; }
        .login-card .demo-info {
            margin-top: 14px;
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            padding: 8px;
            background: var(--bg);
            border-radius: var(--radius-sm);
        }

        /* ===== APP ===== */
        .app-container { display: none; min-height: 100vh; }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--primary);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        .app-header .left { display: flex; align-items: center; gap: 14px; }
        .app-header .left .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .app-header .left .menu-btn:hover { background: rgba(255,255,255,0.1); }
        .app-header .left .brand {
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .app-header .left .brand span { color: var(--gold); }
        .app-header .left .brand small { font-size: 10px; font-weight: 400; opacity: 0.7; margin-left: 4px; }
        .app-header .center {
            flex: 1;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
            display: none;
        }
        .app-header .center input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 14px;
            transition: var(--transition);
        }
        .app-header .center input::placeholder { color: rgba(255,255,255,0.6); }
        .app-header .center input:focus { background: rgba(255,255,255,0.2); outline: none; }
        .app-header .center .icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .app-header .right { display: flex; align-items: center; gap: 10px; }
        .app-header .right .btn-icon {
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .right .btn-icon:hover { color: white; background: rgba(255,255,255,0.1); }
        .app-header .right .btn-icon .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }
        .app-header .right .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
            transition: var(--transition);
        }
        .app-header .right .user-info:hover { background: rgba(255,255,255,0.15); }
        .app-header .right .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .app-header .right .user-info .name { color: white; font-size: 13px; font-weight: 500; }
        .app-header .right .user-info .role { color: rgba(255,255,255,0.6); font-size: 10px; }
        .app-header .right .shop-select {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        .app-header .right .shop-select option { color: var(--text); background: var(--card); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--card);
            z-index: 200;
            transition: left 0.3s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0,0,0,0.08);
            padding-top: var(--header-height);
            border-right: 1px solid var(--border);
        }
        .sidebar.open { left: 0; }
        .sidebar .inner { padding: 8px 0 80px; }
        .sidebar .brand-side {
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar .brand-side h2 { color: var(--primary); font-size: 1.1rem; font-weight: 700; }
        .sidebar .brand-side h2 span { color: var(--gold); }
        .sidebar .brand-side .ver { font-size: 9px; color: var(--text-light); }
        .sidebar .nav-section {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-light);
            padding: 14px 20px 4px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .sidebar .nav-item {
            display: block;
            width: 100%;
            padding: 9px 20px;
            background: none;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-weight: 500;
        }
        .sidebar .nav-item:hover { background: var(--bg); color: var(--primary); }
        .sidebar .nav-item.active { background: var(--bg); border-left-color: var(--gold); color: var(--primary); }
        .sidebar .nav-item .icon { margin-right: 10px; font-size: 15px; }
        .sidebar .nav-item .badge-nav { float: right; background: var(--gold); color: white; font-size: 9px; padding: 1px 8px; border-radius: 10px; }
        .sidebar .nav-divider { height: 1px; background: var(--border); margin: 6px 20px; }
        .sidebar .nav-logout { color: var(--danger) !important; }
        .sidebar .nav-logout:hover { background: #fee2e2 !important; }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show { display: block; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding-top: var(--header-height);
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 20px;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .page-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .page-header h1 small { font-size: 13px; font-weight: 400; color: var(--text-light); margin-left: 6px; }
        .page-header .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .page-content { padding: 0 16px 16px; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: none;
            justify-content: space-around;
            padding: 4px 0;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
            z-index: 100;
            border-top: 1px solid var(--border);
        }
        .bottom-nav button {
            background: none;
            border: none;
            padding: 4px 6px;
            font-size: 9px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            transition: var(--transition);
        }
        .bottom-nav button .nav-icon { font-size: 18px; }
        .bottom-nav button.active { color: var(--primary); font-weight: 600; }

        /* ===== CARDS ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card);
            padding: 14px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .stat-card .stat-icon { font-size: 22px; margin-bottom: 2px; }
        .stat-card .stat-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .stat-card .stat-value { font-size: 20px; font-weight: 700; color: var(--primary); margin-top: 2px; }
        .stat-card .stat-value.gold { color: var(--gold); }
        .stat-card .stat-value.danger { color: var(--danger); }
        .stat-card .stat-value.success { color: var(--success); }
        .stat-card .stat-value.ai { color: var(--ai); }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .section-card:hover { box-shadow: var(--shadow); }
        .section-card .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        .dark-mode .section-card .card-title { color: white; }
        .section-card .card-title .badge {
            background: var(--secondary);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: var(--card);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .kpi-card .kpi-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
        }
        .kpi-card .kpi-value { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 2px; }
        .kpi-card .kpi-value.gold { color: var(--gold); }
        .kpi-card .kpi-value.danger { color: var(--danger); }

        /* ===== FORMS ===== */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group label .req { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212,168,67,0.1);
        }
        .form-group input[readonly] { background: var(--border); cursor: not-allowed; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { transform: translateY(-1px); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { transform: translateY(-1px); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #d1d5db; transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: white; }
        .btn-gold:hover { transform: translateY(-1px); }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
        .btn-ai:hover { transform: translateY(-1px); }
        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

        /* ===== TABLES ===== */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        table th, table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }
        table th {
            background: var(--bg);
            font-weight: 700;
            color: var(--text-light);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        table tr:hover td { background: var(--bg); }
        table .empty-row td { text-align: center; color: var(--text-light); padding: 24px; }

        /* ===== BADGES ===== */
        .badge-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-paid { background: var(--success); color: white; }
        .badge-pending { background: var(--warning); color: white; }
        .badge-overdue { background: var(--danger); color: white; }
        .badge-active { background: var(--success); color: white; }
        .badge-inactive { background: var(--danger); color: white; }
        .badge-low { background: var(--warning); color: white; }
        .badge-out { background: var(--danger); color: white; }
        .badge-partial { background: var(--ai); color: white; }
        .badge-dead { background: #6b7280; color: white; }

        /* ===== SEARCH ===== */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-bar input, .search-bar select {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            min-width: 100px;
            flex: 1;
        }
        .search-bar input:focus, .search-bar select:focus { border-color: var(--gold); outline: none; }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border);
            box-shadow: 0 24px 80px rgba(0,0,0,0.2);
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .modal-header h3 { color: var(--primary); font-size: 1.1rem; font-weight: 700; }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-close:hover { background: var(--bg); transform: rotate(90deg); }
        .modal-body { max-height: calc(90vh - 120px); overflow-y: auto; }

        /* ===== TOAST ===== */
        .toast-message {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 999;
            font-weight: 600;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast-message.success { background: var(--success); }
        .toast-message.error { background: var(--danger); }

        // ============================================================

        // ============================================================
        function generateSessionToken() {
            return 'ses_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36)
                .substring(2, 15);
        }

        function startSession(user) {
            const token = generateSessionToken();
            user.sessionToken = token;
            user.loginTime = new Date().toISOString();

            loginSessions.push({
                userId: user.id,
                username: user.username,
                token: token,
                loginTime: user.loginTime,
                ip: 'local',
                device: navigator.userAgent || 'Unknown',
                active: true
            });

            localStorage.setItem('currentUser', JSON.stringify(user));
            localStorage.setItem('sessionToken', token);

            if (sessionCheckInterval) clearInterval(sessionCheckInterval);
            sessionCheckInterval = setInterval(checkSessionTimeout, 60000);

            return token;
        }

        function checkSessionTimeout() {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) return;

            try {
                const user = JSON.parse(storedUser);
                if (user.loginTime) {
                    const elapsed = Date.now() - new Date(user.loginTime).getTime();
                    if (elapsed > sessionTimeout) {
                        logout();
                        showToast('Session expired. Please login again.', 'warning');
                    }
                }
            } catch (e) {}
        }

        function validateSession() {
            const token = localStorage.getItem('sessionToken');
            if (!token) return false;

            const session = loginSessions.find(s => s.token === token && s.active === true);
            if (!session) return false;

            const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
            if (!user || !user.id) return false;

            return true;
        }

        function endSession(userId) {
            const sessions = loginSessions.filter(s => s.userId === userId);
            sessions.forEach(s => s.active = false);
            localStorage.removeItem('currentUser');
            localStorage.removeItem('sessionToken');
            if (sessionCheckInterval) {
                clearInterval(sessionCheckInterval);
                sessionCheckInterval = null;
            }
        }

        // ============================================================
        // SECURITY: PASSWORD MANAGEMENT
        // ============================================================
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'hash_' + Math.abs(hash).toString(36) + '_' + password.length;
        }

        function verifyPassword(input, stored) {
            return hashPassword(input) === stored || input === stored;
        }

        function generateRandomPassword(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

            if (!modPerms) return false;
            return modPerms[action] === true;

        function login() {
            const username = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Enter username and password';
                errorEl.style.display = 'block';
                return;
            }

            let user = userAccounts.find(u => u.username === username);

            if (!user) {
                const staff = staffMembers.find(s => s.username === username);
                if (staff) {
                    if (verifyPassword(password, staff.password)) {
                        const existingUser = userAccounts.find(u => u.staffId === staff.id);
                        if (existingUser) {
                            user = existingUser;
                        } else {
                            const userId = 'USR' + String(counters.user++).padStart(3, '0');
                            const newUser = {
                                id: userId,
                                username: staff.username,
                                fullName: staff.name,
                                role: staff.role || 'Staff',
                                email: staff.email || '',
                                password: staff.password,
                                status: 'Active',
                                staffId: staff.id,
                                permissions: staff.role === 'Owner' || staff.role === 'Admin' ? 'full' : 'edit',
                                loginAttempts: 0,
                                locked: false,
                                lastLogin: null,
                                createdAt: new Date().toISOString()
                            };
                            userAccounts.push(newUser);
                            user = newUser;
                            saveData();
                        }
                    }
                }
            }

            if (!user) {
                if (username === 'admin' && password === 'admin123') {
                    let adminUser = userAccounts.find(u => u.username === 'admin');
                    if (!adminUser) {
                        const userId = 'USR001';
                        adminUser = {
                            id: userId,
                            username: 'admin',
                            fullName: 'Super Admin',
                            role: 'Owner',
                            email: 'admin@msbagshop.com',
                            password: hashPassword('admin123'),
                            status: 'Active',
                            staffId: 'STF001',
                            permissions: 'full',
                            loginAttempts: 0,
                            locked: false,
                            lastLogin: null,
                            createdAt: new Date().toISOString()
                        };
                        userAccounts.push(adminUser);
                        saveData();
                    }
                    user = adminUser;
                } else {
                    errorEl.textContent = 'Invalid username or password.';
                    errorEl.style.display = 'block';
                    const failedUser = userAccounts.find(u => u.username === username);
                    if (failedUser) {
                        failedUser.loginAttempts = (failedUser.loginAttempts || 0) + 1;
                        if (failedUser.loginAttempts >= 5) {
                            failedUser.locked = true;
                            addNotification(`User ${username} locked due to multiple failed attempts`, 'danger');
                        }
                        saveData();
                    }
                    return;
                }
            }

            if (user.locked) {
                errorEl.textContent = 'Account is locked. Contact admin.';
                errorEl.style.display = 'block';
                return;
            }

            if (user.status !== 'Active') {
                errorEl.textContent = 'Account is deactivated. Contact admin.';
                errorEl.style.display = 'block';
                return;
            }

            if (!verifyPassword(password, user.password)) {
                errorEl.textContent = 'Invalid password.';
                errorEl.style.display = 'block';
                user.loginAttempts = (user.loginAttempts || 0) + 1;
                if (user.loginAttempts >= 5) {
                    user.locked = true;
                    addNotification(`User ${username} locked due to multiple failed attempts`, 'danger');
                }
                saveData();
                return;
            }

            user.loginAttempts = 0;
            user.locked = false;
            user.lastLogin = new Date().toISOString();

            const staff = staffMembers.find(s => s.id === user.staffId);

            let perms = getDefaultPermissions();

            if (user.role === 'Owner' || user.role === 'Admin') {
                MODULES.forEach(m => { ACTIONS.forEach(a => { perms[m][a] = true; }); });
            } else if (user.role === 'Manager') {
                MODULES.forEach(m => {
                    perms[m].view = true;
                    perms[m].add = true;
                    perms[m].edit = true;
                    perms[m].export = true;

                perms.pos.print = true;
                perms.pos.discount = true;
                perms.invoices.view = true;

                perms.products.view = true;

        function savePasswordChange() {
            const current = document.getElementById('cpCurrent').value;
            const newPass = document.getElementById('cpNew').value;
            const confirm = document.getElementById('cpConfirm').value;

            const user = userAccounts.find(u => u.id === currentUser.id);
            if (!user) { showToast('User not found', 'error'); return; }

            if (!verifyPassword(current, user.password)) {
                showToast('Current password is incorrect', 'error');
                return;
            }

            if (newPass.length < 4) {
                showToast('New password must be at least 4 characters', 'error');
                return;
            }

            if (newPass !== confirm) {
                showToast('Passwords do not match', 'error');
                return;
            }

            user.password = hashPassword(newPass);
            const staff = staffMembers.find(s => s.id === user.staffId);
            if (staff) staff.password = user.password;

            saveData();
            closeModal();
            showToast('✅ Password changed successfully', 'success');
            logAudit('CHANGE_PASSWORD', `User ${currentUser.name} changed password`);
            addNotification(`Password changed for ${currentUser.name}`, 'info');
        }

            const wb = XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

            const link = document.createElement('a');

        function getStockStatus(product) {
            const stock = product.stock || 0;
            const min = product.minStock || 5;
            if (stock === 0) return { label: 'Out of Stock', class: 'badge-out' };
            if (stock <= min) return { label: 'Low Stock', class: 'badge-low' };
            return { label: 'In Stock', class: 'badge-paid' };
        }

        function calculateProfit(product, price) {
            const cost = product.costPrice || 0;
            const profit = price - cost;
            const margin = cost > 0 ? (profit / cost) * 100 : 0;
            return { profit, margin };
        }

            const month = today.slice(0, 7);

            const totalSales = invoices.reduce((s, inv) => s + inv.grandTotal, 0);
            const salesToday = invoices.filter(inv => inv.date === today).reduce((s, inv) => s + inv.grandTotal, 0);
            const salesMonth = invoices.filter(inv => inv.date.startsWith(month)).reduce((s, inv) => s + inv.grandTotal, 0);

            const totalIncome = transactions.filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'Expense').reduce((s, t) => s + t.amount, 0);
            const netProfit = totalIncome - totalExpense;
            const grossProfit = totalSales - products.reduce((s, p) => s + ((p.salesCount || 0) * (p.costPrice || 0)), 0);

            const cashBalance = totalIncome - totalExpense;
            const esewaBalance = esewa.balance || 0;

            const totalStock = products.reduce((s, p) => s + (p.stock || 0), 0);
            const inventoryValue = products.reduce((s, p) => s + ((p.stock || 0) * (p.costPrice || 0)), 0);
            const lowStock = products.filter(p => (p.stock || 0) <= (p.minStock || 5)).length;

                items.push({ type: '📦 Product', name: p.name,

            });

            customers.filter(c => c.fullName.toLowerCase().includes(query) || c.mobile.includes(query)).forEach(c => {
                items.push({ type: '👤 Customer', name: c.fullName,
                    detail: `${c.mobile} | ${c.membershipLevel||'None'}`, link: 'customers', id: c.id });

            invoices.filter(inv => inv.invoiceNumber.toLowerCase().includes(query) || inv.customerName.toLowerCase()

                items.push({ type: '🏭 Supplier', name: s.supplierName,
                    detail: `${s.phone} | ${s.company||'N/A'}`, link: 'suppliers', id: s.id });
            });

            staffMembers.filter(s => s.name.toLowerCase().includes(query) || s.employeeId.toLowerCase().includes(query) || s
                .username.toLowerCase().includes(query) || s.mobile.includes(query)).forEach(s => {
                items.push({ type: '👤 Staff', name: s.name,
                    detail: `${s.employeeId} | ${s.position} | ${s.role}`, link: 'staff', id: s.id });
            });

            if (!items.length) {

            let html =
                `<div class="table-wrapper"><table><thead><tr><th>Type</th><th>Name</th><th>Details</th><th>Action</th></tr></thead><tbody>`;

            results.innerHTML = html;

        // POS Functions
        function posSearchCustomer() {
            const query = document.getElementById('posCustomer').value.trim();
            const results = document.getElementById('posCustomerResults');
            if (!query) { results.innerHTML = ''; return; }
            const matches = customers.filter(c => c.fullName.toLowerCase().includes(query.toLowerCase()) || c.mobile
                .includes(query));
            if (matches.length) {
                results.innerHTML = matches.map(c =>
                    `<div class="result-item" onclick="posSelectCustomer('${c.id}')">
                        <span>${c.fullName} - ${c.mobile}</span>
                        <span style="font-size:11px;color:var(--text-light);">${c.membershipLevel||'None'}</span>
                    </div>`
                ).join('');
            } else {
                results.innerHTML =
                    `<div class="result-item" onclick="posCreateCustomer('${query}')">➕ Create new: ${query}</div>`;
            }
        }

        function posSelectCustomer(id) {
            const c = customers.find(cu => cu.id === id);
            if (!c) return;
            document.getElementById('posCustomer').value = c.fullName;
            document.getElementById('posCustomerPhone').value = c.mobile;
            document.getElementById('posMembership').value = c.membershipLevel || 'None';
            document.getElementById('posCustomerResults').innerHTML = '';
        }

        function posCreateCustomer(name) {
            const c = {
                id: 'C' + String(counters.customer++).padStart(3, '0'),
                fullName: name,
                mobile: '',
                email: '',
                address: '',
                membershipLevel: 'Regular',
                loyaltyPoints: 0,
                creditLimit: 0,
                totalPurchases: 0,
                dueBalance: 0,
                purchaseHistory: [],
                createdAt: new Date().toISOString()
            };
            customers.push(c);
            posSelectCustomer(c.id);
            showToast('✅ New customer created', 'success');
            logAudit('CREATE_CUSTOMER', `Customer ${name} created`);
        }

        function posSearchProduct() {
            const query = document.getElementById('posProductSearch').value.trim().toLowerCase();
            const results = document.getElementById('posProductResults');
            if (!query) { results.innerHTML = ''; return; }
            const matches = products.filter(p =>
                p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (p.barcode &&
                    p.barcode.includes(query))
            );
            if (!matches.length) { results.innerHTML = '<div class="result-item">No products found</div>'; return; }
            results.innerHTML = matches.slice(0, 8).map(p => `
                    <div class="result-item" onclick="posAddProduct('${p.id}')">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <img src="${p.images && p.images.length ? p.images[0] : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'}" style="width:35px;height:35px;object-fit:cover;border-radius:4px;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'">
                            <div>
                                <div style="font-weight:600;font-size:13px;">${p.name}</div>
                                <div style="font-size:11px;color:var(--text-light);">${p.sku||''} | Stock: ${p.stock}</div>
                            </div>
                        </div>
                        <div style="font-weight:700;color:var(--gold);">${CURRENCY} ${p.sellingPrice}</div>
                    </div>
                `).join('');
        }

        function posQuickAdd(id) { posAddProduct(id); }

        function posAddProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) { showToast('Product not found', 'error'); return; }
            const qty = parseInt(document.getElementById('posQty').value) || 1;
            if (qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
            const existing = posCart.find(item => item.id === p.id);
            if (existing) {
                if (existing.qty + qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
                existing.qty += qty;
                existing.lineTotal = existing.qty * existing.price;
            } else {
                posCart.push({
                    id: p.id,
                    name: p.name,
                    sku: p.sku || '',
                    image: (p.images && p.images.length) ? p.images[0] : null,
                    price: p.sellingPrice,
                    qty: qty,
                    lineTotal: qty * p.sellingPrice,
                    stock: p.stock
                });
            }
            document.getElementById('posProductSearch').value = '';
            document.getElementById('posProductResults').innerHTML = '';
            document.getElementById('posPrice').value = p.sellingPrice;
            posUpdateCart();
            showToast(`✅ ${p.name} added`, 'success');
        }

        function posRemoveFromCart(idx) { posCart.splice(idx, 1);
            posUpdateCart(); }

        function posClearCart() { if (posCart.length && confirm('Clear cart?')) { posCart = [];
                posUpdateCart(); } }

        function posCancelSale() { if (posCart.length && confirm('Cancel this sale?')) { posCart = [];
                posUpdateCart();
                showToast('❌ Sale cancelled', 'warning'); } }

        function posUpdateCart() {
            const container = document.getElementById('posCart');
            const count = document.getElementById('cartCount');
            if (!container) return;
            if (count) count.textContent = posCart.length;

            if (!posCart.length) {
                container.innerHTML = '<p style="color:var(--text-light);padding:10px;text-align:center;">Cart empty</p>';
                posCalcTotals();
                return;
            }

            let html =
                `<div class="table-wrapper"><table><thead><tr><th>Image</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>`;
            posCart.forEach((item, idx) => {
                html += `
                        <tr>
                            <td><img src="${item.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'}" style="width:35px;height:35px;object-fit:cover;border-radius:4px;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'"></td>
                            <td><strong>${item.name}</strong><br><span style="font-size:10px;color:var(--text-light);">${item.sku||''}</span></td>
                            <td>
                                <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, -1)">-</button>
                                ${item.qty}
                                <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, 1)">+</button>
                            </td>
                            <td>${CURRENCY} ${item.price}</td>
                            <td>${CURRENCY} ${item.lineTotal.toFixed(2)}</td>
                            <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${idx})">✕</button></td>
                        </tr>
                    `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            posCalcTotals();
        }

        function posChangeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty < 1) return;
            const prod = products.find(p => p.id === item.id);
            if (prod && newQty > prod.stock) { showToast(`Insufficient stock! Available: ${prod.stock}`, 'error'); return; }
            item.qty = newQty;
            item.lineTotal = item.qty * item.price;
            posUpdateCart();
        }

        function posCalcTotals() {
            const subtotal = posCart.reduce((s, i) => s + i.lineTotal, 0);
            const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
            const taxRate = settings.taxRate || VAT_RATE;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const grandTotal = afterDiscount + tax;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const change = Math.max(0, paid - grandTotal);
            const due = Math.max(0, grandTotal - paid);

            document.getElementById('posSubtotal').value = subtotal.toFixed(2);
            document.getElementById('posTax').value = tax.toFixed(2);
            document.getElementById('posGrandTotal').value = grandTotal.toFixed(2);
            document.getElementById('posChange').value = change.toFixed(2);
            document.getElementById('posStatus').value = due === 0 ? 'Paid' : (paid > 0 ? 'Partial' : 'Due');
            document.getElementById('posPoints').value = Math.floor(grandTotal / 10);
        }

        function posHoldSale() {
            if (!posCart.length) { alert('Cart is empty'); return; }
            heldSales.push({
                id: Date.now(),
                cart: JSON.parse(JSON.stringify(posCart)),
                customer: document.getElementById('posCustomer').value,
                date: new Date().toISOString()
            });
            posCart = [];
            posUpdateCart();
            showToast('📌 Sale held', 'success');
            logAudit('HOLD_SALE', 'Sale held');
        }

        function posResumeSale() {
            if (!heldSales.length) { alert('No held sales'); return; }
            const list = heldSales.map((s, i) =>
                `<div class="result-item" onclick="posResumeSaleById(${i})">
                    <span>Sale ${i+1} - ${s.customer||'Walk-in'} - ${s.cart.length} items</span>
                    <span style="font-size:10px;color:var(--text-light);">${new Date(s.date).toLocaleString()}</span>
                </div>`
            ).join('');
            openModal('📌 Resume Held Sale', list);
        }

        function posResumeSaleById(idx) {
            const sale = heldSales[idx];
            if (!sale) return;
            posCart = sale.cart;
            document.getElementById('posCustomer').value = sale.customer;
            heldSales.splice(idx, 1);
            closeModal();
            posUpdateCart();
            showToast('✅ Sale resumed', 'success');
        }

        function posCompleteSale() {
            if (!posCart.length) { alert('Cart is empty!'); return; }

            const customerName = document.getElementById('posCustomer').value.trim() || 'Walk-in';
            const customerPhone = document.getElementById('posCustomerPhone').value.trim();
            const paymentMethod = document.getElementById('posPayment').value;
            const date = document.getElementById('posInvDate').value || new Date().toISOString().slice(0, 10);
            const shop = document.getElementById('posShop').value;

            const subtotal = parseFloat(document.getElementById('posSubtotal').value) || 0;
            const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
            const tax = parseFloat(document.getElementById('posTax').value) || 0;
            const grandTotal = parseFloat(document.getElementById('posGrandTotal').value) || 0;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const due = Math.max(0, grandTotal - paid);
            const points = Math.floor(grandTotal / 10);
            const paymentStatus = due === 0 ? 'Paid' : (paid > 0 ? 'Partial' : 'Unpaid');

            const nextNum = settings.nextInvoiceNumber || 1001;
            const invNumber =
                `${settings.invoicePrefix||'INV'}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(nextNum).padStart(6,'0')}`;

            if (customerName !== 'Walk-in') {
                const cust = customers.find(c => c.fullName === customerName);
                if (cust && cust.creditLimit > 0) {
                    const totalDue = invoices.filter(inv => inv.customerName === customerName && inv.paymentStatus !==
                        'Paid').reduce((s, inv) => s + inv.balanceDue, 0);
                    if (totalDue + due > cust.creditLimit) {
                        showToast(`Credit limit exceeded! Available: ${cust.creditLimit - totalDue}`, 'error');
                        return;
                    }
                }
            }

            const invoice = {
                id: 'INV' + String(counters.invoice++).padStart(3, '0'),
                invoiceNumber: invNumber,
                date: date,
                time: new Date().toLocaleTimeString(),
                shop: shop,
                customerName: customerName,
                customerPhone: customerPhone,
                salesperson: currentUser.name,
                items: posCart.map(item => ({
                    productId: item.id,
                    productName: item.name,
                    sku: item.sku || '',
                    image: item.image || null,
                    quantity: item.qty,
                    unitPrice: item.price,
                    lineTotal: item.lineTotal
                })),
                subtotal: subtotal,
                discountAmount: discount,
                tax: tax,
                grandTotal: grandTotal,
                paidAmount: paid,
                balanceDue: due,
                paymentMethod: paymentMethod,
                paymentStatus: paymentStatus,
                loyaltyPoints: points,
                createdAt: new Date().toISOString()
            };

            invoice.items.forEach(item => {
                const prod = products.find(p => p.id === item.productId);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - item.quantity);
                    prod.salesCount = (prod.salesCount || 0) + item.quantity;
                    prod.lastSaleDate = date;
                    if (shopInventory[prod.id]) {
                        if (shopInventory[prod.id][shop] !== undefined) {
                            shopInventory[prod.id][shop] = Math.max(0, shopInventory[prod.id][shop] - item.quantity);
                        }
                    }
                }
                stockMovements.push({
                    productId: item.productName,
                    type: 'Sale',
                    quantity: -item.quantity,
                    date: date,
                    reference: invNumber,
                    shop: shop
                });
            });

            let cust = customers.find(c => c.fullName === customerName);
            if (cust) {
                cust.totalPurchases = (cust.totalPurchases || 0) + grandTotal;
                cust.loyaltyPoints = (cust.loyaltyPoints || 0) + points;
                cust.dueBalance = (cust.dueBalance || 0) + due;
                if (!cust.purchaseHistory) cust.purchaseHistory = [];
                cust.purchaseHistory.push({ invoiceNumber: invNumber, total: grandTotal, date: date });
            }

            if (paid > 0) {
                transactions.push({
                    id: 'TXN' + String(transactions.length + 1).padStart(4, '0'),
                    date: date,
                    account: 'Sales',
                    type: 'Income',
                    amount: paid,
                    paymentMethod: paymentMethod,
                    reference: invNumber,
                    description: `Sale ${invNumber}`
                });
                if (paymentMethod === 'eSewa') {
                    esewa.balance = (esewa.balance || 0) + paid;
                }
            }

            invoices.push(invoice);
            settings.nextInvoiceNumber = (settings.nextInvoiceNumber || 1001) + 1;
            posCart = [];
            saveData();
            renderPOS();
            showToast(`✅ Invoice ${invNumber} completed!`, 'success');
            addNotification(`Invoice ${invNumber} created for ${customerName}`, 'success');
            logAudit('CREATE_INVOICE', `Invoice ${invNumber} created, ${grandTotal}`);

            if (confirm('Print invoice now?')) {
                viewInvoice(invoice.id);
                setTimeout(() => {
                    const btn = document.querySelector('#modalBody .btn-gold');
                    if (btn) btn.click();
                }, 500);
            }
        }

            const invNumber = document.getElementById('posInvNumber').value;

        function filterInvoices() {
            const q = document.getElementById('invSearch')?.value.toLowerCase() || '';
            const status = document.getElementById('invStatusFilter')?.value || '';
            const shop = document.getElementById('invShopFilter')?.value || '';
            document.querySelectorAll('#invBody tr').forEach(row => {
                if (row.classList.contains('empty-row')) return;
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(q) && (status === '' || text.includes(status.toLowerCase())) &&
                    (shop === '' || text.includes(shop.toLowerCase())) ? '' : 'none';
            });
        }

            inv.paymentStatus = document.getElementById('editInvStatus').value;

        function prodSave() {
            const name = document.getElementById('prodName').value.trim();
            const sku = document.getElementById('prodSku').value.trim();
            const cost = parseFloat(document.getElementById('prodCost').value) || 0;
            const price = parseFloat(document.getElementById('prodSelling').value) || 0;
            if (!name || !sku || cost <= 0 || price <= 0) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            let imageData = null;
            const fileInput = document.getElementById('prodImage');
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { imageData = e.target.result;
                    saveProduct(imageData); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveProduct(null);
            }
        }

        function saveProduct(imageData) {
            const name = document.getElementById('prodName').value.trim();
            const sku = document.getElementById('prodSku').value.trim();
            const cost = parseFloat(document.getElementById('prodCost').value) || 0;
            const price = parseFloat(document.getElementById('prodSelling').value) || 0;

            const p = {
                id: 'P' + String(counters.product++).padStart(3, '0'),
                code: 'P' + String(counters.product - 1).padStart(3, '0'),
                name,
                sku,
                barcode: document.getElementById('prodBarcode').value || 'BAR' + String(Date.now()).slice(-10),
                category: document.getElementById('prodCategory').value,
                brand: document.getElementById('prodBrand').value || '',
                color: document.getElementById('prodColor').value || '',
                size: document.getElementById('prodSize').value || '',
                material: document.getElementById('prodMaterial').value || '',
                costPrice: cost,
                sellingPrice: price,
                wholesalePrice: parseFloat(document.getElementById('prodWholesale').value) || 0,
                mrpPrice: parseFloat(document.getElementById('prodMRP').value) || 0,
                minStock: parseInt(document.getElementById('prodMinStock').value) || 5,
                maxStock: parseInt(document.getElementById('prodMaxStock').value) || 100,
                description: document.getElementById('prodDesc').value || '',
                features: document.getElementById('prodFeatures').value || '',
                bestFor: document.getElementById('prodBestFor').value,
                warehouse: document.getElementById('prodShop').value,
                warranty: document.getElementById('prodWarranty').value || '',
                origin: document.getElementById('prodOrigin').value || '',
                images: imageData ? [imageData] : [],
                status: 'Active',
                stock: 0,
                salesCount: 0,
                countryOfOrigin: document.getElementById('prodOrigin').value || '',
                createdAt: new Date().toISOString()
            };

            products.push(p);
            if (!shopInventory[p.id]) shopInventory[p.id] = {};
            SHOPS.forEach(shop => { shopInventory[p.id][shop] = 0; });

            saveData();
            closeModal();
            renderProducts();
            showToast('✅ Product added', 'success');
            addNotification(`Product ${name} added`, 'success');
            logAudit('CREATE_PRODUCT', `Product ${name} added`);
        }

        function prodSaveEdit(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            const oldPrice = p.sellingPrice;
            const newPrice = parseFloat(document.getElementById('editProdSelling').value) || p.sellingPrice;

            p.name = document.getElementById('editProdName').value || p.name;
            p.sku = document.getElementById('editProdSku').value || p.sku;
            p.costPrice = parseFloat(document.getElementById('editProdCost').value) || p.costPrice;
            p.sellingPrice = newPrice;
            p.wholesalePrice = parseFloat(document.getElementById('editProdWholesale').value) || p.wholesalePrice;
            p.mrpPrice = parseFloat(document.getElementById('editProdMRP').value) || p.mrpPrice;
            p.description = document.getElementById('editProdDesc').value || p.description;
            p.status = document.getElementById('editProdStatus').value;

            if (newPrice !== oldPrice) {
                priceHistory.push({
                    productId: p.id,
                    productName: p.name,
                    oldPrice: oldPrice,
                    newPrice: newPrice,
                    date: new Date().toISOString(),
                    changedBy: currentUser.name
                });
                logAudit('PRICE_CHANGE', `${p.name}: ${oldPrice} → ${newPrice}`);
            }

            saveData();
            closeModal();
            renderProducts();
            showToast('✅ Product updated', 'success');
            logAudit('EDIT_PRODUCT', `Product ${p.name} updated`);
        }

        function prodDelete(id) {
            if (confirm('Delete this product?')) {
                const p = products.find(pr => pr.id === id);
                products = products.filter(pr => pr.id !== id);
                delete shopInventory[id];
                saveData();
                renderProducts();
                showToast('🗑️ Deleted', 'success');
                logAudit('DELETE_PRODUCT', `Product ${p?.name} deleted`);
            }

        function prodUploadImage(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    p.images = p.images || [];
                    p.images.push(ev.target.result);
                    saveData();
                    renderProducts();
                    showToast('✅ Image uploaded', 'success');
                    logAudit('UPLOAD_IMAGE', `Image for ${p.name}`);
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function pricingSaveChange(id) {

            if (!newPrice || newPrice <= 0) { alert('Enter valid price'); return; }
            priceHistory.push({

                oldPrice: p.sellingPrice,
                newPrice: newPrice,

                date: new Date().toISOString(),

            p.sellingPrice = newPrice;
            saveData();
            closeModal();

        function invAdjustStock() {
            openModal('Adjust Stock', `
                <div class="form-group"><label>Product</label><select id="adjProduct">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
                <div class="form-group"><label>Shop</label><select id="adjShop">${SHOPS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
                <div class="form-group"><label>New Quantity</label><input id="adjQty" type="number"></div>
                <div class="form-group"><label>Reason</label><input id="adjReason" placeholder="Stock count"></div>
                <button class="btn btn-primary" onclick="invSaveAdjust()">💾 Save</button>
            `);
        }

        function invSaveAdjust() {
            const productId = document.getElementById('adjProduct').value;
            const shop = document.getElementById('adjShop').value;
            const newQty = parseInt(document.getElementById('adjQty').value) || 0;
            const reason = document.getElementById('adjReason').value.trim() || 'Adjustment';

            const prod = products.find(p => p.id === productId);
            if (!prod) return;

            const oldQty = shopInventory[productId]?.[shop] || 0;
            const diff = newQty - oldQty;

            shopInventory[productId][shop] = newQty;
            prod.stock = Object.values(shopInventory[productId]).reduce((s, v) => s + v, 0);

            stockMovements.push({
                productId: prod.name,
                type: 'Stock Adjustment',
                quantity: diff,
                date: new Date().toISOString().slice(0, 10),
                reference: reason,
                shop: shop
            });

            saveData();
            closeModal();
            renderInventory();
            showToast(`✅ ${prod.name} in ${shop} now ${newQty}`, 'success');
            logAudit('STOCK_ADJUST', `${prod.name}: ${oldQty} → ${newQty} in ${shop}`);
        }

        function galleryUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;
            input.onchange = function(e) {
                const files = e.target.files;
                for (let f of files) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const title = prompt('Image title:', f.name) || f.name;
                        galleries.push({
                            id: 'GAL' + String(galleries.length + 1).padStart(3, '0'),
                            url: ev.target.result,
                            title: title,
                            uploadDate: new Date().toISOString()
                        });
                        saveData();
                        renderGallery();
                        showToast(`✅ ${title} uploaded`, 'success');
                        logAudit('GALLERY_UPLOAD', `Image ${title}`);
                    };
                    reader.readAsDataURL(f);
                }
            };
            input.click();
        }

        function galleryDelete(id) {
            if (confirm('Delete this image?')) {
                galleries = galleries.filter(g => g.id !== id);
                saveData();
                renderGallery();
                showToast('🗑️ Deleted', 'success');
                logAudit('GALLERY_DELETE', `Image ${id}`);
            }
        }

            const content = document.getElementById('psPreviewContainer');
            if (!content || !content.innerHTML.trim()) { showToast('Please preview first', 'warning'); return; }

            const productId = document.getElementById('psProduct').value;
            const p = products.find(pr => pr.id === productId);
            const type = document.getElementById('psPrintType').value;
            const typeLabel = PRINT_TYPES.find(t => t.id === type);
            const copies = parseInt(document.getElementById('psCopies').value) || 1;

            printHistory.push({
                id: 'PRT' + String(printHistory.length + 1).padStart(3, '0'),
                date: new Date().toISOString(),
                productId: productId,
                productName: p ? p.name : 'Unknown',
                type: typeLabel ? typeLabel.name : type,
                copies: copies,
                user: currentUser.name
            });
            saveData();

            const printContent = content.innerHTML;
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Print - ${typeLabel ? typeLabel.name : 'Print'}</title>
                <style>

                    .no-print{display:none;}

                    ${document.querySelector('style').innerHTML}

                <script>
                    setTimeout(()=>{
                        window.print();
                        setTimeout(()=>window.close(), 1000);
                    }, 500);
                <\/script>
                </body></html>
            `);
            win.document.close();

            showToast(`🖨️ Print sent (${copies} copies)`, 'success');
            logAudit('PRINT_STUDIO', `${typeLabel ? typeLabel.name : type} printed for ${p ? p.name : 'Unknown'}`);

        function purchReceive(id) {
            const po = purchaseOrders.find(p => p.id === id);
            if (!po) return;
            const prod = products.find(p => p.name === po.product);
            if (prod) {
                prod.stock = (prod.stock || 0) + po.qty;
                const shop = prod.warehouse || SHOPS[0];
                if (shopInventory[prod.id]) {
                    shopInventory[prod.id][shop] = (shopInventory[prod.id][shop] || 0) + po.qty;
                }
                stockMovements.push({
                    productId: po.product,
                    type: 'Purchase',
                    quantity: po.qty,
                    date: new Date().toISOString().slice(0, 10),
                    reference: po.purchaseNo
                });
            }
            po.status = 'Received';
            saveData();
            renderPurchases();
            showToast(`✅ ${po.qty} ${po.product} received`, 'success');
            logAudit('RECEIVE_PURCHASE', `PO ${po.purchaseNo}`);

        function transferSave() {
            const productId = document.getElementById('trProduct').value;
            const fromShop = document.getElementById('trFrom').value;
            const toShop = document.getElementById('trTo').value;
            const qty = parseInt(document.getElementById('trQty').value) || 0;
            if (!productId || qty <= 0) { alert('Product and quantity required'); return; }
            if (fromShop === toShop) { alert('Source and destination must be different'); return; }

            const available = shopInventory[productId]?.[fromShop] || 0;
            if (qty > available) { alert(`Insufficient stock in ${fromShop}. Available: ${available}`); return; }

            shopTransfers.push({
                id: 'TR' + String(shopTransfers.length + 1).padStart(3, '0'),
                productId,
                fromShop,
                toShop,
                quantity: qty,
                status: 'Pending Approval',
                requestedBy: currentUser.name,
                createdAt: new Date().toISOString()
            });
            saveData();
            closeModal();
            renderTransfers();
            showToast('✅ Transfer submitted', 'success');
            addNotification(`Transfer: ${qty} from ${fromShop} to ${toShop}`, 'warning');
            logAudit('CREATE_TRANSFER', `${qty} from ${fromShop} to ${toShop}`);
        }

        function transferApprove(id) {
            const t = shopTransfers.find(tr => tr.id === id);
            if (!t) return;
            t.status = 'In Transit';
            t.approvedBy = currentUser.name;
            t.approvedDate = new Date().toISOString();
            saveData();
            renderTransfers();
            showToast('✅ Transfer approved', 'success');
            logAudit('APPROVE_TRANSFER', `Transfer ${t.id}`);
        }

        function transferReceive(id) {
            const t = shopTransfers.find(tr => tr.id === id);
            if (!t) return;
            if (shopInventory[t.productId]) {
                shopInventory[t.productId][t.fromShop] = Math.max(0, (shopInventory[t.productId][t.fromShop] || 0) - t
                    .quantity);
                shopInventory[t.productId][t.toShop] = (shopInventory[t.productId][t.toShop] || 0) + t.quantity;
                const prod = products.find(p => p.id === t.productId);
                if (prod) {
                    prod.stock = Object.values(shopInventory[t.productId]).reduce((s, v) => s + v, 0);
                }
                stockMovements.push({
                    productId: t.productId,
                    type: 'Transfer In',
                    quantity: t.quantity,
                    date: new Date().toISOString().slice(0, 10),
                    reference: t.id,
                    shop: t.toShop
                });
            }
            t.status = 'Completed';
            t.receivedDate = new Date().toISOString();
            saveData();
            renderTransfers();
            showToast('✅ Transfer completed', 'success');
            addNotification(`Transfer ${t.id} completed`, 'success');
            logAudit('RECEIVE_TRANSFER', `Transfer ${t.id}`);
        }

            const totalSales = invoices.reduce((s, i) => s + i.grandTotal, 0);
            const totalCost = products.reduce((s, p) => s + ((p.salesCount || 0) * (p.costPrice || 0)), 0);
            const profit = totalSales - totalCost;
            const data = [{
                'Metric': 'Total Sales',
                'Amount': totalSales
            }, {
                'Metric': 'Total Cost',
                'Amount': totalCost
            }, {
                'Metric': 'Gross Profit',
                'Amount': profit
            }, {
                'Metric': 'Profit Margin',
                'Amount': totalSales > 0 ? (profit / totalSales * 100).toFixed(1) + '%' : '0%'
            }];
            exportToExcel(data, 'Profit_Report');
            showToast('📊 Profit Report exported', 'success');
        }

        function staffSave() {
            const name = document.getElementById('staffName').value.trim();
            const position = document.getElementById('staffPosition').value.trim();
            const mobile = document.getElementById('staffMobile').value.trim();
            if (!name || !position || !mobile) { alert('Name, position and mobile required'); return; }

            const staffId = 'STF' + String(counters.staff++).padStart(3, '0');
            const employeeId = 'EMP-' + String(counters.staff - 1).padStart(4, '0');

            const staff = {
                id: staffId,
                employeeId: employeeId,
                name,
                position,
                department: document.getElementById('staffDept').value || 'General',
                mobile,
                email: document.getElementById('staffEmail').value.trim(),
                salary: parseFloat(document.getElementById('staffSalary').value) || 0,
                joiningDate: new Date().toISOString().slice(0, 10),
                status: 'Active',
                role: document.getElementById('staffRole').value,
                shift: document.getElementById('staffShift').value,
                username: '',
                password: '',
                userAccount: '',
                createdAt: new Date().toISOString()
            };

            if (document.getElementById('staffCreateUser').checked) {
                const username = document.getElementById('staffUsername').value.trim();
                let password = document.getElementById('staffPassword').value.trim();

                if (!username) {
                    alert('Username is required when creating a user account.');
                    return;
                }

                if (userAccounts.find(u => u.username === username)) {
                    alert('Username already exists. Please choose another.');
                    return;
                }

                if (!password || password.length < 4) {
                    password = generateRandomPassword(8);
                    showToast(`Generated password for ${username}: ${password}`, 'info');
                }

                const userId = 'USR' + String(counters.user++).padStart(3, '0');
                userAccounts.push({
                    id: userId,
                    username: username,
                    fullName: name,
                    role: staff.role,
                    email: staff.email || '',
                    password: hashPassword(password),
                    status: 'Active',
                    staffId: staffId,
                    permissions: staff.role === 'Owner' || staff.role === 'Admin' ? 'full' : 'edit',
                    loginAttempts: 0,
                    locked: false,
                    lastLogin: null,
                    createdAt: new Date().toISOString()
                });
                staff.username = username;
                staff.password = hashPassword(password);
                staff.userAccount = userId;
                addNotification(`User ${username} created for ${name}`, 'success');
            }

            staffMembers.push(staff);
            saveData();
            closeModal();
            renderStaff();
            showToast(`✅ Staff ${name} added successfully`, 'success');
            logAudit('CREATE_STAFF', `Staff ${name} added with ${staff.username ? 'user '+staff.username : 'no user'}`);
        }

        function staffResetPassword(userId) {
            const user = userAccounts.find(u => u.id === userId);
            if (!user) return;

            const newPass = prompt(`Enter new password for ${user.username} (min 4 chars):`, generateRandomPassword(8));
            if (newPass && newPass.length >= 4) {
                user.password = hashPassword(newPass);
                const staff = staffMembers.find(s => s.id === user.staffId);
                if (staff) staff.password = user.password;
                saveData();
                showToast(`✅ Password reset for ${user.username}`, 'success');
                logAudit('RESET_PASSWORD', `Password reset for ${user.username}`);
            } else if (newPass !== null && newPass.length < 4) {
                showToast('Password must be at least 4 characters', 'error');
            }
        }
