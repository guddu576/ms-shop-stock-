            const user = userAccounts.find(u => u.id === userId);
            if (!user) return;

            const newStatus = user.status === 'Active' ? 'Inactive' : 'Active';
            if (confirm(`Set user ${user.username} to ${newStatus}?`)) {
                user.status = newStatus;
                const staff = staffMembers.find(s => s.id === user.staffId);
                if (staff) staff.status = newStatus;
                saveData();
                renderStaff();
                showToast(`✅ User ${user.username} ${newStatus === 'Active' ? 'activated' : 'deactivated'}`, 'success');

            if (confirm('Delete this staff member? This will also remove their user account.')) {

                        <table><thead><tr><th>Name</th><th>Type</th><th>Date</th><th>Status</th></tr></thead>

        function backupNow() {
            backups.push({
                id: 'BK' + String(backups.length + 1).padStart(3, '0'),
                name: 'Backup-' + new Date().toISOString().slice(0, 10),
                type: 'Manual',
                date: new Date().toISOString(),
                status: 'Success'
            });
            saveData();
            renderBackup();
            showToast('✅ Backup created', 'success');
            logAudit('BACKUP_CREATED', 'Manual backup');
        }

        function backupRestore() { showToast('↩️ Restore (demo)', 'info'); }

        function backupExport() {
            const data = JSON.stringify({
                products, customers, suppliers, invoices, purchaseOrders, productionOrders,
                shopTransfers, expenses, transactions, stockMovements, staffMembers,
                userAccounts, members, galleries, priceHistory, backups, notifications,
                settings, shopInventory, auditLogs, esewa, counters, labelTemplates, printHistory, loginSessions,
                lastSaved: new Date().toISOString()
            }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `MS_Backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            showToast('📤 Data exported', 'success');
            logAudit('BACKUP_EXPORT', 'Data exported');
        }

        function backupImport() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.products) products = data.products;
                        if (data.customers) customers = data.customers;
                        if (data.suppliers) suppliers = data.suppliers;
                        if (data.invoices) invoices = data.invoices;
                        if (data.purchaseOrders) purchaseOrders = data.purchaseOrders;
                        if (data.productionOrders) productionOrders = data.productionOrders;
                        if (data.shopTransfers) shopTransfers = data.shopTransfers;
                        if (data.expenses) expenses = data.expenses;
                        if (data.transactions) transactions = data.transactions;
                        if (data.stockMovements) stockMovements = data.stockMovements;
                        if (data.staffMembers) staffMembers = data.staffMembers;
                        if (data.userAccounts) userAccounts = data.userAccounts;
                        if (data.members) members = data.members;
                        if (data.galleries) galleries = data.galleries;
                        if (data.priceHistory) priceHistory = data.priceHistory;
                        if (data.backups) backups = data.backups;
                        if (data.notifications) notifications = data.notifications;
                        if (data.settings) settings = data.settings;
                        if (data.shopInventory) shopInventory = data.shopInventory;
                        if (data.auditLogs) auditLogs = data.auditLogs;
                        if (data.esewa) esewa = data.esewa;
                        if (data.counters) counters = data.counters;
                        if (data.labelTemplates) labelTemplates = data.labelTemplates;
                        if (data.printHistory) printHistory = data.printHistory;
                        if (data.loginSessions) loginSessions = data.loginSessions;
                        saveData();
                        showToast('📥 Data imported', 'success');
                        logAudit('BACKUP_IMPORT', 'Data imported');
                        renderBackup();
                    } catch (err) { alert('Invalid file'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function plUpdateFields() {
            const modifier = document.getElementById('plPriceModifier')?.value || 'normal';
            document.getElementById('plDiscountFields').style.display = (modifier === 'discount' || modifier === 'was_now_pct' || modifier === 'mega_clearance') ? 'block' : 'none';
            document.getElementById('plWasNowFields').style.display = (modifier === 'was_now_mat' || modifier === 'was_now_d20' || modifier === 'was_now_bd' || modifier === 'was_now_pct') ? 'block' : 'none';
            document.getElementById('plRedPriceFields').style.display = (modifier === 'red_price' || modifier === 'red_price_image' || modifier === 'mega_clearance') ? 'block' : 'none';

            if (modifier === 'discount' || modifier === 'was_now_pct' || modifier === 'mega_clearance') {
                plCalculateDiscount();
            }
            if (modifier === 'was_now_mat' || modifier === 'was_now_d20' || modifier === 'was_now_bd' || modifier === 'was_now_pct') {
                plCalculateWasNow();
            }
        }

        function plCalculateDiscount() {
            const original = parseFloat(document.getElementById('plOriginalPrice').value) || 0;
            const discountPct = parseFloat(document.getElementById('plDiscountPercent').value) || 0;
            const discountAmt = (original * discountPct) / 100;
            const finalPrice = original - discountAmt;
            document.getElementById('plDiscountAmount').value = discountAmt.toFixed(2);
            document.getElementById('plFinalPrice').value = finalPrice.toFixed(2);
        }

        function plCalculateWasNow() {
            const was = parseFloat(document.getElementById('plWasPrice').value) || 0;
            const now = parseFloat(document.getElementById('plNowPrice').value) || 0;
            const save = was - now;
            document.getElementById('plSaveAmount').value = save.toFixed(2);
        }

        function plPreview() {

            const modifier = document.getElementById('plPriceModifier').value;

            const warranty = document.getElementById('plWarranty').value;

            const toggles = {};
            document.querySelectorAll('.pl-field-toggle').forEach(cb => {
                toggles[cb.value] = cb.checked;
            });

            const originalPrice = parseFloat(document.getElementById('plOriginalPrice').value) || p.sellingPrice || 0;
            const discountPct = parseFloat(document.getElementById('plDiscountPercent').value) || 0;
            const discountAmt = parseFloat(document.getElementById('plDiscountAmount').value) || 0;
            const finalPrice = parseFloat(document.getElementById('plFinalPrice').value) || p.sellingPrice || 0;
            const wasPrice = parseFloat(document.getElementById('plWasPrice').value) || p.sellingPrice || 0;
            const nowPrice = parseFloat(document.getElementById('plNowPrice').value) || p.sellingPrice || 0;
            const saveAmt = parseFloat(document.getElementById('plSaveAmount').value) || 0;
            const redPrice = parseFloat(document.getElementById('plRedPrice').value) || p.sellingPrice || 0;

                        ${toggles.product_image && p.images && p.images.length ? `<img src="${p.images[0]}" class="product-image" onerror="this.style.display='none'">` : ''}
                        ${toggles.product_name ? `<div class="product-name">${p.name}</div>` : ''}
                        ${toggles.brand ? `<div class="brand-name">${p.brand || ''}</div>` : ''}
                        ${toggles.sku ? `<div class="sku-code">SKU: ${p.sku || p.code}</div>` : ''}

                    </div>

                    <div class="label-prices">
                        ${modifier === 'normal' ? `

                        ${modifier === 'no_price' ? `

                            <div class="price-now">Current: ${CURRENCY} ${p.sellingPrice}</div>
                        ` : ''}

                        ${modifier === 'red_price' || modifier === 'red_price_image' ? `
                            ${toggles.red_price ? `<div class="price-red">${CURRENCY} ${redPrice}</div>` : ''}

                            ${toggles.now_price ? `<div class="price-now">NOW: ${CURRENCY} ${nowPrice}</div>` : ''}
                            ${toggles.discount_pct && modifier === 'was_now_pct' ? `<div class="price-discount">${discountPct}% OFF</div>` : ''}
                            ${toggles.discount_amount ? `<div class="price-save">SAVE: ${CURRENCY} ${saveAmt.toFixed(2)}</div>` : ''}
                            ${document.getElementById('plPromotionTitle').value ? `<div style="font-size:13px;font-weight:600;">${document.getElementById('plPromotionTitle').value}</div>` : ''}

                        ${promoModifier === 'mega_clearance' ? `
                            <div class="price-was">${CURRENCY} ${originalPrice}</div>

                        ${toggles.promotion_text && promotionText ? `<div style="font-size:13px;font-weight:600;margin-top:4px;">${promotionText}</div>` : ''}

                    <div class="label-barcode">
                        ${toggles.barcode ? `<svg id="labelBarcodePreview"></svg>` : ''}

                    <div class="label-footer">

            document.getElementById('plPreviewContainer').innerHTML = labelHtml;

            setTimeout(() => {
                const bc = document.getElementById('labelBarcodePreview');
                if (bc && typeof JsBarcode !== 'undefined') {
                    try {
                        JsBarcode(bc, p.barcode || p.sku || p.code, {
                            format: 'CODE128',
                            displayValue: true,
                            fontSize: 12,
                            height: 40,
                            width: 1.5
                        });
                    } catch (e) {}
                }
                const qr = document.getElementById('labelQrPreview');
                if (qr && typeof QRCode !== 'undefined') {

                        text: p.barcode || p.sku || p.code,
                        width: 60,
                        height: 60
                    });
                }
            }, 200);

            showToast('👁️ Label preview generated', 'success');
        }

        function plPrint() {
            const content = document.getElementById('labelPreviewPrint');
            if (!content) { showToast('Please preview first', 'warning'); return; }
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Price Label</title>
                <style>
                    body{padding:20px;background:white;font-family:sans-serif;}
                    .label-preview{max-width:400px;margin:0 auto;padding:20px;border:1px solid #ddd;border-radius:8px;background:white;}
                    .label-preview .label-header{text-align:center;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:8px;}
                    .label-preview .label-header .store-name{font-size:14px;font-weight:700;color:#0a1628;}
                    .label-preview .label-header .store-logo{font-size:28px;}
                    .label-preview .label-product{text-align:center;}
                    .label-preview .label-product .product-image{max-width:120px;max-height:120px;object-fit:contain;margin:0 auto;display:block;}
                    .label-preview .label-product .product-name{font-size:16px;font-weight:700;margin-top:6px;}
                    .label-preview .label-product .brand-name{font-size:12px;color:#666;}
                    .label-preview .label-product .sku-code{font-size:10px;color:#999;}
                    .label-preview .label-prices{text-align:center;margin-top:8px;padding:8px;background:#f8f9fa;border-radius:6px;}
                    .label-preview .label-prices .price-was{font-size:14px;color:#999;text-decoration:line-through;}
                    .label-preview .label-prices .price-now{font-size:22px;font-weight:700;color:#d4a843;}
                    .label-preview .label-prices .price-red{font-size:22px;font-weight:700;color:#dc2626;}
                    .label-preview .label-prices .price-discount{font-size:13px;color:#10b981;font-weight:600;}
                    .label-preview .label-prices .price-save{font-size:13px;color:#dc2626;font-weight:600;}
                    .label-preview .label-barcode{text-align:center;margin-top:8px;}
                    .label-preview .label-barcode svg{max-width:180px;}
                    .label-preview .label-footer{text-align:center;font-size:9px;color:#999;margin-top:8px;padding-top:8px;border-top:1px solid #eee;}
                    .label-preview .label-badge{display:inline-block;padding:2px 12px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}
                    .label-preview .label-badge.red{background:#dc2626;color:white;}
                    .label-preview .label-badge.gold{background:#d4a843;color:white;}
                    .label-preview .label-badge.green{background:#10b981;color:white;}
                    .label-preview .label-badge.blue{background:#3b82f6;color:white;}
                    .no-print{display:none;}
                </style>
                </head><body>
                ${content.outerHTML}
                <script>setTimeout(()=>window.print(),500);<\/script>

            win.document.close();
        }

        function plSaveTemplate() {
            const productId = document.getElementById('plProduct').value;
            if (!productId) { showToast('Select a product first', 'warning'); return; }

            const template = {
                id: 'TMP' + String(labelTemplates.length + 1).padStart(3, '0'),
                name: prompt('Enter template name:', 'Label-' + new Date().toISOString().slice(0, 10)),
                productId: productId,
                template: document.getElementById('plTemplate').value,
                priceModifier: document.getElementById('plPriceModifier').value,
                promotionModifier: document.getElementById('plPromotionModifier').value,
                productModifier: document.getElementById('plProductModifier').value,
                warranty: document.getElementById('plWarranty').value,
                originalPrice: document.getElementById('plOriginalPrice').value,
                discountPercent: document.getElementById('plDiscountPercent').value,
                wasPrice: document.getElementById('plWasPrice').value,
                nowPrice: document.getElementById('plNowPrice').value,
                redPrice: document.getElementById('plRedPrice').value,
                promotionText: document.getElementById('plRedText').value || document.getElementById('plPromotionTitle')
                    .value,
                fields: {},
                createdAt: new Date().toISOString()
            };

            document.querySelectorAll('.pl-field-toggle').forEach(cb => {
                template.fields[cb.value] = cb.checked;
            });

            if (template.name) {
                labelTemplates.push(template);
                saveData();
                renderPriceLabels();
                showToast('✅ Template saved successfully', 'success');
                logAudit('SAVE_LABEL_TEMPLATE', `Template ${template.name} saved`);
            }
        }

        function plLoadTemplate() {
            if (!labelTemplates.length) { showToast('No saved templates', 'info'); return; }
            const list = labelTemplates.map((t, i) =>
                `<div class="result-item" onclick="plLoadTemplateById(${i})">
                    <span>${t.name||'Template '+(i+1)} - ${t.productId?products.find(p=>p.id===t.productId)?.name||'Unknown':'-'}</span>
                    <span style="font-size:11px;color:var(--text-light);">${t.template}</span>
                </div>`
            ).join('');
            openModal('📂 Load Template', list);
        }

        function plLoadTemplateById(idx) {
            const t = labelTemplates[idx];
            if (!t) { showToast('Template not found', 'error'); return; }

            document.getElementById('plProduct').value = t.productId || '';
            document.getElementById('plTemplate').value = t.template || 'Normal Price Label';
            document.getElementById('plPriceModifier').value = t.priceModifier || 'normal';
            document.getElementById('plPromotionModifier').value = t.promotionModifier || '';
            document.getElementById('plProductModifier').value = t.productModifier || '';
            document.getElementById('plWarranty').value = t.warranty || 'No Warranty';
            document.getElementById('plOriginalPrice').value = t.originalPrice || 0;
            document.getElementById('plDiscountPercent').value = t.discountPercent || 0;
            document.getElementById('plWasPrice').value = t.wasPrice || 0;
            document.getElementById('plNowPrice').value = t.nowPrice || 0;
            document.getElementById('plRedPrice').value = t.redPrice || 0;
            document.getElementById('plRedText').value = t.promotionText || '';
            document.getElementById('plPromotionTitle').value = t.promotionText || '';

            if (t.fields) {
                document.querySelectorAll('.pl-field-toggle').forEach(cb => {
                    cb.checked = t.fields[cb.value] !== undefined ? t.fields[cb.value] : true;
                });
            }

            plUpdateFields();
            closeModal();
            showToast('✅ Template loaded', 'success');
            plPreview();
        }

        function plDeleteTemplate(idx) {
            if (confirm('Delete this template?')) {
                const t = labelTemplates[idx];
                labelTemplates.splice(idx, 1);
                saveData();
                renderPriceLabels();
                showToast('🗑️ Template deleted', 'success');
                if (t) logAudit('DELETE_LABEL_TEMPLATE', `Template ${t.name} deleted`);
            }
        }

        function plExportPDF() {
            const content = document.getElementById('labelPreviewPrint');
            if (!content) { showToast('Please preview first', 'warning'); return; }
            if (typeof html2pdf !== 'undefined') {
                html2pdf().from(content).save(`Label_${new Date().toISOString().slice(0,10)}.pdf`);
                showToast('📄 PDF Exporting...', 'success');
                logAudit('EXPORT_LABEL_PDF', 'Price label exported as PDF');
            } else {
                showToast('📄 PDF export (demo) - html2pdf library needed', 'info');
            }
        }

        function plExportExcel() {
            const data = [{
                'Product': document.getElementById('plProduct').value ? products.find(p => p.id === document.getElementById(
                    'plProduct').value)?.name || '-' : '-',
                'Template': document.getElementById('plTemplate').value,
                'Price Modifier': document.getElementById('plPriceModifier').value,
                'Promotion': document.getElementById('plPromotionModifier').value,
                'Product Modifier': document.getElementById('plProductModifier').value,
                'Warranty': document.getElementById('plWarranty').value,
                'Original Price': document.getElementById('plOriginalPrice').value || 0,
                'Discount %': document.getElementById('plDiscountPercent').value || 0,
                'Final Price': document.getElementById('plFinalPrice').value || 0,
                'Was Price': document.getElementById('plWasPrice').value || 0,
                'Now Price': document.getElementById('plNowPrice').value || 0,
                'Red Price': document.getElementById('plRedPrice').value || 0,
                'Promotion Text': document.getElementById('plRedText').value || document.getElementById('plPromotionTitle')
                    .value || ''
            }];
            exportToExcel(data, 'Price_Label');
            showToast('📊 Excel exported', 'success');
            logAudit('EXPORT_LABEL_EXCEL', 'Price label exported as Excel');
        }

        // ============================================================
        // GLOBAL SEARCH
        // ============================================================
        function globalSearch() {
            const query = document.getElementById('globalSearch')?.value?.trim()?.toLowerCase();
            if (!query) return;
            navigateTo('search');
            setTimeout(() => {
                const input = document.getElementById('searchQuery');
                if (input) { input.value = query;
                    performSearch(); }
            }, 100);
        }

        // ============================================================
        // INIT
        // ============================================================
        window.onload = function() {
            // Check for existing session
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser && validateSession()) {
                try {
                    const user = JSON.parse(storedUser);
                    currentUser = user;
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    document.getElementById('userAvatar').textContent = currentUser.name.split(' ').map(w => w[0]).join('')
                        .toUpperCase().slice(0, 2);
                    document.getElementById('userName').textContent = currentUser.name;
                    document.getElementById('userRole').textContent = currentUser.role;
                    initData();
                    navigateTo('dashboard');
                    return;
                } catch (e) {}
            }

            // Default login
            let perms = getDefaultPermissions();
            MODULES.forEach(m => { ACTIONS.forEach(a => { perms[m][a] = true; }); });

            currentUser = {
                id: 'USR001',
                name: 'Super Admin',
                role: 'Owner',
                permissions: perms,
                staffId: 'STF001',
                username: 'admin'
            };

            // Show login screen
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    const input = document.getElementById('globalSearch');
                    if (input && document.getElementById('appContainer').style.display !== 'none') {
                        input.focus();
                        input.select();
                    }
                }
            });

            console.log('🔑 Demo Staff Accounts:');
            console.log('admin / admin123 (Owner)');
            console.log('john / john123 (Manager)');
            console.log('jane / jane123 (Salesman)');
            console.log('🛡️ Security: Session timeout, login history, password hashing active');
        };
    </script>
</body>
